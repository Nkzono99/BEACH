#:schema https://raw.githubusercontent.com/Nkzono99/BEACH/main/schemas/beach.schema.json

[sim]
dt = 5.0e-8
batch_count = 20
max_step = 80
rng_seed = 12345
field_solver = "direct"

[domain]
box_min = [0.0, 0.0, 0.0]
box_max = [1.0, 1.0, 1.0]
periodic_axes = []

[field_boundary]
mode = "free"

[particle_boundary]
z_low = "open"
z_high = "open"

[particles]
[[particles.species]]
source_mode = "volume_seed"
q_particle = -1.602176634e-19
m_particle = 9.10938356e-31
w_particle = 2.0e5
npcls_per_step = 200
pos_low = [0.15, 0.15, 0.8]
pos_high = [0.85, 0.85, 0.8]
drift_velocity = [0.0, 0.0, -1.0e6]
temperature_k = 0.0

[mesh]
mode = "template"

[[mesh.templates]]
kind = "plane"
enabled = true
surface_model = "insulator"
surface_side = "normal_plus"
size_x = 0.8
size_y = 0.8
nx = 12
ny = 12
center = [0.5, 0.5, 0.2]

[output]
write_files = true
dir = "outputs/tutorial"
history_stride = 1
write_mesh_potential = true
write_potential_history = true
