[run]
batch_count = 1

[domain]
box_min = [
    0.0,
    0.0,
    0.0,
]
box_max = [
    1.0,
    1.0,
    1.0,
]
periodic_axes = []

[mesh]
mode = "template"

[[mesh.templates]]
kind = "plane"
enabled = true
surface_side = "normal_plus"
center = [
    0.5,
    0.5,
    0.5,
]
size_x = 0.5
size_y = 0.5
nx = 1
ny = 1

[particles.tracking]
dt_s = 1e-09
max_steps_per_particle = 1

[particles.boundary]
x_low = "open"
x_high = "reflect"
y_low = "reflect"
y_high = "open"
z_low = "open"
z_high = "redistributed_reflect"

[[particles.species]]
charge_c = -1.0
mass_kg = 1.0

[particles.species.source]
mode = "volume_seed"

[particles.species.sampling]
volume_macro_particles_per_batch = 1

[particles.species.distribution]
temperature_k = 0.0

[particles.species.boundary]
x_low = "reflect"
x_high = "open"
y_low = "inherit"
y_high = "reflect"
z_low = "reflect"
z_high = "inherit"

[fields]
boundary = "free"

[output]
enabled = true
dir = "test_particle_boundary_faces_output"

[output.checkpoint]
stride_batches = 2
