#:schema https://raw.githubusercontent.com/Nkzono99/BEACH/main/schemas/beach.schema.json
# Generated by beachx config init
# source_config=examples/periodic2_matching_plane_zhao_online.toml

[run]
batch_count = 4
rng_seed = 12345

[run.batch]
duration_s = 1e-08

[domain]
box_min = [
    0.0,
    0.0,
    0.0,
]
box_max = [
    0.0001,
    0.0001,
    0.001,
]
periodic_axes = [
    "x",
    "y",
]

[mesh]
mode = "template"

[[mesh.templates]]
kind = "plane"
enabled = true
surface_model = "insulator"
surface_side = "normal_plus"
size_x = 0.0001
size_y = 0.0001
nx = 8
ny = 8
center = [
    5e-05,
    5e-05,
    2e-06,
]

[particles.tracking]
dt_s = 2e-12
max_steps_per_particle = 4000

[particles.boundary]
z_low = "open"
z_high = "open"
open_model = "escape"

[particles.reservoir]
inflow_model = "source_vdf"

[[particles.species]]
species_key = "solar_wind_electron"
charge_c = -1.602176634e-19
mass_kg = 9.1093837139e-31

[particles.species.distribution]
number_density_cm3 = 5.0
temperature_ev = 10.0
drift_velocity_m_s = [
    0.0,
    0.0,
    -400000.0,
]

[particles.species.sampling]
target_macro_particles_per_batch = 300

[particles.species.charging]
closure = "explicit"

[particles.species.inflow]
z_high = "reservoir"

[[particles.species]]
species_key = "solar_wind_ion"
charge_c = 1.602176634e-19
mass_kg = 1.67262192369e-27

[particles.species.distribution]
number_density_cm3 = 5.0
temperature_ev = 0.1
drift_velocity_m_s = [
    0.0,
    0.0,
    -400000.0,
]

[particles.species.sampling]
target_macro_particles_per_batch = 300

[particles.species.charging]
closure = "explicit"

[particles.species.inflow]
z_high = "reservoir"

[[particles.species]]
species_key = "photoelectron"
charge_c = -1.602176634e-19
mass_kg = 9.1093837139e-31

[particles.species.source]
mode = "photo_raycast"
emit_current_density_a_m2 = 1e-08
deposit_opposite_charge_on_emit = true
normal_drift_speed_m_s = 0.0
inject_face = "z_high"
pos_low = [
    0.0,
    0.0,
    0.001,
]
pos_high = [
    0.0001,
    0.0001,
    0.001,
]
ray_direction = [
    0.0,
    0.0,
    -1.0,
]

[particles.species.sampling]
rays_per_batch = 300

[particles.species.charging]
closure = "explicit"

[particles.species.distribution]
temperature_ev = 2.2

[fields]
boundary = "periodic2"

[fields.solver]
method = "fmm"

[fields.periodic]
image_layers = 1
ewald_layers = 4
cache_dir = ".beach_cache/periodic2"
lower_boundary_model = "symmetric_vacuum"
backend = "cached_kneq0"

[sheath]
closure = "matching_plane"
response = "zhao"

[sheath.zhao]
branch = "auto"

[sheath.species]
electron = "solar_wind_electron"
ion = "solar_wind_ion"
photoelectron = "photoelectron"

[sheath.coupling]
rtol = 0.0001
max_iterations = 20
relaxation = 0.5

[sheath.coupling.atol]
photoelectron_outward_flux_m2_s = 0.0
photoelectron_mean_normal_energy_ev = 0.0
electron_outward_flux_m2_s = 0.0
ion_outward_flux_m2_s = 0.0

[output]
enabled = true
dir = "outputs/periodic2_matching_plane_zhao_online"

[output.final]
mesh_potential = true

[output.history]
potential = true
stride_batches = 1
