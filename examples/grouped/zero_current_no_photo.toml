#:schema https://raw.githubusercontent.com/Nkzono99/BEACH/main/schemas/beach.schema.json
# Generated by beachx config init
# source_config=examples/periodic2_zhao_no_photo_fixed_current.toml

[run]
batch_count = 10
rng_seed = 12345

[run.batch]
duration_s = 0.5

[domain]
box_min = [
    0.0,
    0.0,
    0.0,
]
box_max = [
    0.0001,
    0.0001,
    0.001,
]
periodic_axes = [
    "x",
    "y",
]

[mesh]
mode = "template"

[[mesh.templates]]
kind = "plane"
enabled = true
surface_model = "insulator"
surface_side = "normal_plus"
size_x = 0.0001
size_y = 0.0001
nx = 8
ny = 8
center = [
    5e-05,
    5e-05,
    2e-06,
]

[particles.tracking]
dt_s = 2e-12
max_steps_per_particle = 100000

[particles.boundary]
z_low = "open"
z_high = "open"

[particles.reservoir]
inflow_model = "source_vdf"

[[particles.species]]
species_key = "solar_wind_electron"
charge_c = -1.602176634e-19
mass_kg = 9.1093837139e-31

[particles.species.distribution]
number_density_cm3 = 8.7
temperature_ev = 12.0
drift_velocity_m_s = [
    0.0,
    0.0,
    0.0,
]

[particles.species.sampling]
target_macro_particles_per_batch = 300

[particles.species.charging]
closure = "fixed_current"

[particles.species.inflow]
z_high = "reservoir"

[[particles.species]]
species_key = "solar_wind_ion"
charge_c = 1.602176634e-19
mass_kg = 1.67262192369e-27

[particles.species.distribution]
number_density_cm3 = 8.7
temperature_ev = 0.1
drift_velocity_m_s = [
    0.0,
    0.0,
    -405299.88897,
]

[particles.species.sampling]
target_macro_particles_per_batch = 300

[particles.species.charging]
closure = "fixed_current"

[particles.species.inflow]
z_high = "reservoir"

[fields]
boundary = "periodic2"

[fields.solver]
method = "fmm"

[fields.periodic]
image_layers = 1
backend = "finite_images"

[sheath]
closure = "zero_current"

[sheath.zhao]
branch = "auto"

[sheath.species]
electron = "solar_wind_electron"
ion = "solar_wind_ion"

[sheath.photoelectrons]
source_scale = 0.0

[output]
enabled = true
dir = "outputs/periodic2_zhao_no_photo_fixed_current"

[output.history]
stride_batches = 1
