#:schema https://raw.githubusercontent.com/Nkzono99/BEACH/main/schemas/beach.schema.json
# Generated by beachx config init
# source_config=examples/periodic2_cached_panel.toml

[run]
batch_count = 1

[domain]
box_min = [
    0.0,
    0.0,
    0.0,
]
box_max = [
    1.0,
    1.0,
    1.0,
]
periodic_axes = [
    "x",
    "y",
]

[mesh]
mode = "template"

[[mesh.templates]]
enabled = true
kind = "plane"
surface_model = "insulator"
surface_side = "normal_plus"
center = [
    0.5,
    0.5,
    0.25,
]
size_x = 1.0
size_y = 1.0
nx = 8
ny = 8

[particles.tracking]
dt_s = 1e-10
max_steps_per_particle = 20

[particles.boundary]
z_low = "open"
z_high = "open"

[[particles.species]]
enabled = true
charge_c = -1.602176634e-19
mass_kg = 9.10938356e-31

[particles.species.source]
mode = "volume_seed"
pos_low = [
    0.2,
    0.2,
    0.4,
]
pos_high = [
    0.8,
    0.8,
    0.8,
]

[particles.species.sampling]
volume_macro_particles_per_batch = 4

[particles.species.distribution]
drift_velocity_m_s = [
    0.0,
    0.0,
    -100000.0,
]
temperature_k = 0.0

[fields]
boundary = "periodic2"

[fields.solver]
method = "fmm"

[fields.periodic]
image_layers = 1
ewald_layers = 4
cache_dir = ".beach_cache/periodic2"
generation_tolerance = 1e-08
lower_boundary_model = "symmetric_vacuum"
backend = "cached_kneq0"

[output]
enabled = false
