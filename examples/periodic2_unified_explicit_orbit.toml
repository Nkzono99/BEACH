#:schema https://raw.githubusercontent.com/Nkzono99/BEACH/main/schemas/beach.schema.json
# Advanced linear-screening and 3-D outer-orbit fixture; it does not replace the standard kinetic_1d sheath.

[sim]
dt = 1.0e-9
batch_count = 1
max_step = 2
softening = 0.0
field_solver = "direct"
field_bc_mode = "periodic2"
use_box = true
box_min = [0.0, 0.0, 0.0]
box_max = [1.0, 1.0, 1.0]
bc_x_low = "periodic"
bc_x_high = "periodic"
bc_y_low = "periodic"
bc_y_high = "periodic"
bc_z_low = "open"
bc_z_high = "open"

[field]
element_kernel = "triangle_p0"

[periodic2]
nonzero_mode_backend = "panel_spectral_reference"
zero_mode_policy = "exclude_k0"
lower_boundary_model = "symmetric_vacuum"
reference_mode_layers = 4
panel_quadrature_order = 12
interface_sample_n = 8
interface_phi_tolerance = 1.0e-3
interface_field_tolerance = 1.0e-3

[external_boundary.field]
model = "unified_linear_response"
debye_length = 0.2
thermal_voltage = 10.0
accessible_fraction_tolerance = 0.05

[external_boundary.particles]
mode = "same_batch"
inflow_model = "source_vdf"
field_evolution_timescale = 1.0e-4
outer_orbit_dt = 1.0e-9
outer_orbit_max_steps = 10000
outer_orbit_energy_tolerance = 1.0e-3

[particles]
[[particles.species]]
enabled = true
source_mode = "volume_seed"
npcls_per_step = 1
q_particle = -1.602176634e-19
m_particle = 9.1093837015e-31
pos_low = [0.45, 0.45, 0.9]
pos_high = [0.55, 0.55, 0.95]
drift_velocity = [2.0e5, 1.0e5, 1.0e6]
temperature_k = 0.0

[mesh]
mode = "template"

[[mesh.templates]]
enabled = true
kind = "plane"
surface_model = "insulator"
surface_side = "normal_plus"
center = [0.5, 0.5, 0.25]
size_x = 1.0
size_y = 1.0
nx = 2
ny = 2

[output]
write_files = false
