#:schema https://raw.githubusercontent.com/Nkzono99/BEACH/main/schemas/beach.schema.json
# Bounded strong-UV example for the transient Zhao photoelectron-column closure.
# The persistent outer queue delays profile return/escape events and supplies the
# queued photoelectron column used to solve eta at each batch start. This is a
# finite interface-to-10-lambda_D,pe control volume: reaching its outer edge is
# reservoir escape, with no Robin-tail return test beyond that edge. This is a
# frozen-field guard fixture, not an accepted production result. With the
# physical timescale below, a long outer flight is expected to stop fail-closed.
# Use a separately justified slower field-evolution timescale before attempting
# batch-duration and particle-count convergence of the return-current history.

[sim]
dt = 1.979898987322333e-12
batch_duration = 2.5e-7
batch_count = 80
max_step = 20000
tol_rel = 1.0e-8
softening = 0.0
b0 = [0.0, 0.0, 0.0]
use_box = true
box_min = [0.0, 0.0, 0.0]
box_max = [9.899494936611664e-05, 9.899494936611664e-05, 2.0e-04]
bc_x_low = "periodic"
bc_x_high = "periodic"
bc_y_low = "periodic"
bc_y_high = "periodic"
bc_z_low = "open"
bc_z_high = "open"
rng_seed = 24603
field_solver = "direct"
field_bc_mode = "periodic2"
reservoir_potential_model = "none"
open_boundary_model = "escape"
sheath_injection_model = "none"
# Strong-UV analytic effective-plane source. This angle is independent of the
# tracked illumination-ray direction below.
sheath_alpha_deg = 60.0
sheath_photoelectron_ref_density_cm3 = 64.0
sheath_electron_drift_mode = "normal"
sheath_ion_drift_mode = "normal"

[field]
element_kernel = "triangle_p0"

[periodic2]
# This direct spectral reference keeps the example self-contained. Production
# studies normally replace it with cached_kneq0 and revalidate the interface.
nonzero_mode_backend = "panel_spectral_reference"
zero_mode_policy = "exclude_k0"
lower_boundary_model = "symmetric_vacuum"
reference_mode_layers = 2
panel_quadrature_order = 4
interface_sample_n = 2
interface_phi_tolerance = 1.0e-3
interface_field_tolerance = 1.0e-3

[outer_plasma]
model = "kinetic_1d"
kinetic_closure = "zhao_charge_driven"
zhao_branch = "auto"
photoelectron_density_model = "none"
photoelectron_histogram_enabled = false
return_model = "kinetic_1d_profile_return"
interface_z = 2.0e-04
infinity_potential = 0.0
# These are split-interface diagnostic references. The Zhao transient profile
# and its finite column domain use T_pe and the derived lambda_D,pe instead.
debye_length = 10.513585779475326
thermal_voltage = 10.0

[coupling]
update_mode = "explicit"
particle_transfer_mode = "electrostatic_1d_instant_return"
outer_update_stride = 1
# Queue mode bounds batch_duration at configuration time and each resolved
# flight, its delay to the next batch-start poll, and half-batch midpoint
# uncertainty. The total bound is 4 us, so this 0.25 us batch leaves at most
# 3.875 us for flight plus polling delay. A longer flight stops this fixture.
field_evolution_timescale = 2.0e-5
max_frozen_field_ratio = 0.2
outer_queue_enabled = true

[particles]
[[particles.species]]
species_key = "ambient_electron"
enabled = true
source_mode = "reservoir_face"
number_density_cm3 = 8.7
temperature_ev = 12.0
q_particle = -1.602176634e-19
m_particle = 9.10938356e-31
target_macro_particles_per_batch = 64
inject_face = "z_high"
pos_low = [0.0, 0.0, 2.0e-04]
pos_high = [9.899494936611664e-05, 9.899494936611664e-05, 2.0e-04]
drift_velocity = [0.0, 0.0, -4.0529988897111727e5]

[[particles.species]]
species_key = "ambient_proton"
enabled = true
source_mode = "reservoir_face"
number_density_cm3 = 8.7
temperature_ev = 0.1
q_particle = 1.602176634e-19
m_particle = 1.672482821616e-27
target_macro_particles_per_batch = -1
inject_face = "z_high"
pos_low = [0.0, 0.0, 2.0e-04]
pos_high = [9.899494936611664e-05, 9.899494936611664e-05, 2.0e-04]
drift_velocity = [0.0, 0.0, -4.0529988897111727e5]

[[particles.species]]
species_key = "photoelectron"
enabled = true
source_mode = "photo_raycast"
# The runtime requires this tracked source to match the Zhao raw source within
# 1%. Transient eta scales the outer density/Sagdeev terms, not this raw-current
# term in the Zhao current diagnostic.
emit_current_density_a_m2 = 2.2037032292944053e-6
rays_per_batch = 128
deposit_opposite_charge_on_emit = true
q_particle = -1.602176634e-19
m_particle = 9.10938356e-31
temperature_ev = 2.2
normal_drift_speed = 0.0
inject_face = "z_high"
pos_low = [0.0, 0.0, 2.0e-04]
pos_high = [9.899494936611664e-05, 9.899494936611664e-05, 2.0e-04]
ray_direction = [0.0, 0.0, -1.0]

[mesh]
mode = "template"

[[mesh.templates]]
kind = "plane"
enabled = true
surface_model = "insulator"
surface_side = "normal_plus"
size_x = 9.899494936611664e-05
size_y = 9.899494936611664e-05
nx = 2
ny = 2
center = [4.949747468305832e-05, 4.949747468305832e-05, 1.979898987322333e-06]

[output]
write_files = true
dir = "outputs/periodic2_zhao_transient_outer"
history_stride = 1
write_mesh_potential = true
write_potential_history = true
resume = false
