#:schema https://raw.githubusercontent.com/Nkzono99/BEACH/main/schemas/beach.schema.json

# 有限画像 periodic2 で、太陽風は z-high の局所 reservoir から補正なしで注入し、
# 光電子は z-high 反射と neutral-return closure で表面内再分配だけを解く最小例。
# これは自己整合な外部シースではない。image layer、box 高さ、batch_duration、
# dt、max_step、ray 数を目的量に対して収束させること。

[sim]
dt = 2.0e-12
batch_duration = 0.5
batch_count = 10
max_step = 100000
tol_rel = 1.0e-8
b0 = [0.0, 0.0, 0.0]
use_box = true
box_min = [0.0, 0.0, 0.0]
box_max = [1.0e-4, 1.0e-4, 1.0e-3]
bc_x_low = "periodic"
bc_x_high = "periodic"
bc_y_low = "periodic"
bc_y_high = "periodic"
bc_z_low = "open"
bc_z_high = "open"
rng_seed = 12345
injection_face_phi_grid_n = 5
field_solver = "fmm"
field_bc_mode = "periodic2"
field_periodic_image_layers = 1
field_periodic_far_correction = "none"

[external_boundary.field]
model = "none"

[external_boundary.particles]
mode = "local_source"
inflow_model = "source_vdf"

[external_boundary.ordinary_open]
model = "escape"

[particles]

# z-high で定義した局所 boundary VDF。電位による流入補正は行わない。
[[particles.species]]
species_key = "solar_wind_electron"
source_mode = "reservoir_face"
number_density_cm3 = 5.0
temperature_ev = 10.0
q_particle = -1.602176634e-19
m_particle = 9.1093837139e-31
target_macro_particles_per_batch = 300
inject_face = "z_high"
pos_low = [0.0, 0.0, 1.0e-3]
pos_high = [1.0e-4, 1.0e-4, 1.0e-3]
drift_velocity = [0.0, 0.0, -4.0e5]

[[particles.species]]
species_key = "solar_wind_ion"
source_mode = "reservoir_face"
number_density_cm3 = 5.0
temperature_ev = 10.0
q_particle = 1.602176634e-19
m_particle = 1.67262192369e-27
target_macro_particles_per_batch = -1
inject_face = "z_high"
pos_low = [0.0, 0.0, 1.0e-3]
pos_high = [1.0e-4, 1.0e-4, 1.0e-3]
drift_velocity = [0.0, 0.0, -4.0e5]

# 光電子の放出元と解決済み帰還先を使って表面内の電荷再分配を作る。
# max_step まで未帰還の電荷は、同じ batch の帰還先分布へ統計的に繰り込む。
[[particles.species]]
species_key = "photoelectron"
source_mode = "photo_raycast"
emit_current_density_a_m2 = 2.0e-4
rays_per_batch = 300
deposit_opposite_charge_on_emit = true
z_high_boundary = "reflect"
surface_charge_closure = "neutral_return"
q_particle = -1.602176634e-19
m_particle = 9.1093837139e-31
temperature_ev = 1.5
normal_drift_speed = 0.0
inject_face = "z_high"
pos_low = [0.0, 0.0, 1.0e-3]
pos_high = [1.0e-4, 1.0e-4, 1.0e-3]
ray_direction = [0.0, 0.0, -1.0]

[mesh]
mode = "template"

[[mesh.templates]]
kind = "plane"
enabled = true
surface_model = "insulator"
surface_side = "normal_plus"
size_x = 1.0e-4
size_y = 1.0e-4
nx = 20
ny = 20
center = [5.0e-5, 5.0e-5, 2.0e-6]

[[mesh.templates]]
kind = "sphere"
enabled = true
surface_model = "insulator"
surface_side = "outward_closed"
radius = 2.5e-5
center = [5.0e-5, 5.0e-5, 2.8e-5]
n_lon = 16
n_lat = 8

[output]
write_files = true
write_mesh_potential = true
write_potential_history = true
dir = "outputs/periodic2_closed_photoelectron"
history_stride = 1
