#:schema https://raw.githubusercontent.com/Nkzono99/BEACH/main/schemas/beach.schema.json
# Bounded flat-plane stationary warm-start smoke for the charge-driven Zhao kinetic closure.
# The legacy Zhao injection correction is intentionally disabled: accumulated
# surface charge supplies the kinetic outer solve's interface-field condition.
# A full-photoelectron Zhao state has no branch connecting the uncharged state
# to the stationary Type-A root for these parameters. zhao_floating therefore
# initializes the plane charge and outer profile from that stationary root,
# then ordinary small batches exercise reservoir mapping and instant return.
# This fixture validates plumbing, not the uncharged-to-Zhao transient,
# uniqueness, dynamic stability, or a converged production observable.

[sim]
dt = 1.979898987322333e-12
batch_duration = 2.5e-7
batch_count = 2
max_step = 20000
tol_rel = 1.0e-8
softening = 0.0
b0 = [0.0, 0.0, 0.0]
use_box = true
box_min = [0.0, 0.0, 0.0]
box_max = [9.899494936611664e-05, 9.899494936611664e-05, 2.0e-04]
bc_x_low = "periodic"
bc_x_high = "periodic"
bc_y_low = "periodic"
bc_y_high = "periodic"
bc_z_low = "open"
bc_z_high = "open"
rng_seed = 24602
field_solver = "direct"
field_bc_mode = "periodic2"
# alpha controls the analytic Zhao effective-plane source; it does not set the
# tracked ray direction below.
sheath_alpha_deg = 60.0
sheath_photoelectron_ref_density_cm3 = 64.0
sheath_electron_drift_mode = "normal"
sheath_ion_drift_mode = "normal"

[field]
element_kernel = "triangle_p0"

[periodic2]
nonzero_mode_backend = "panel_spectral_reference"
zero_mode_policy = "exclude_k0"
lower_boundary_model = "symmetric_vacuum"
reference_mode_layers = 2
panel_quadrature_order = 4
interface_sample_n = 2
interface_phi_tolerance = 1.0e-3
interface_field_tolerance = 1.0e-3

[external_boundary.field]
model = "kinetic_1d"
kinetic_closure = "zhao_charge_driven"
# These remain split-interface diagnostic references. The Zhao solver instead
# uses T_pe and the Debye length derived from T_pe and n_ref.
debye_length = 10.513585779475326
thermal_voltage = 10.0

[external_boundary.particles]
mode = "same_batch"
steady_start_mode = "zhao_floating"
# The plane alone receives Q_seed=2 epsilon_0 A E_I for symmetric_vacuum;
# every other mesh would remain neutral. This example contains only the plane.
# Smoke-only quasi-steady timescale; production cases must justify this value
# and test sensitivity to an independently relaxed or perturbed seed.
field_evolution_timescale = 1.0

[particles]
[[particles.species]]
species_key = "ambient_electron"
enabled = true
source_mode = "reservoir_face"
number_density_cm3 = 8.7
temperature_ev = 12.0
q_particle = -1.602176634e-19
m_particle = 9.10938356e-31
target_macro_particles_per_batch = 64
inject_face = "z_high"
pos_low = [0.0, 0.0, 2.0e-04]
pos_high = [9.899494936611664e-05, 9.899494936611664e-05, 2.0e-04]
drift_velocity = [0.0, 0.0, -4.0529988897111727e5]

[[particles.species]]
species_key = "ambient_proton"
enabled = true
source_mode = "reservoir_face"
number_density_cm3 = 8.7
# 0.1 eV satisfies the Zhao cold-ion guard T_i <= 0.1 T_e (T_e = 12 eV).
temperature_ev = 0.1
q_particle = 1.602176634e-19
m_particle = 1.672482821616e-27
target_macro_particles_per_batch = -1
inject_face = "z_high"
pos_low = [0.0, 0.0, 2.0e-04]
pos_high = [9.899494936611664e-05, 9.899494936611664e-05, 2.0e-04]
drift_velocity = [0.0, 0.0, -4.0529988897111727e5]

[[particles.species]]
species_key = "photoelectron"
enabled = true
source_mode = "photo_raycast"
# |q| n_ref sin(alpha) sqrt(2 T_pe[J] / m_pe) / (2 sqrt(pi)); the runtime
# requires the tracked source to match this analytic raw current within 1%.
emit_current_density_a_m2 = 2.2037032292944053e-6
rays_per_batch = 128
deposit_opposite_charge_on_emit = true
q_particle = -1.602176634e-19
m_particle = 9.10938356e-31
temperature_ev = 2.2
normal_drift_speed = 0.0
inject_face = "z_high"
pos_low = [0.0, 0.0, 2.0e-04]
pos_high = [9.899494936611664e-05, 9.899494936611664e-05, 2.0e-04]
# Vertical illumination rays are an effective-flat-plane sampling choice independent of
# sheath_alpha_deg; rough-surface ray VDFs are not yet closed into Zhao.
ray_direction = [0.0, 0.0, -1.0]

[mesh]
mode = "template"

[[mesh.templates]]
kind = "plane"
enabled = true
surface_model = "insulator"
surface_side = "normal_plus"
size_x = 9.899494936611664e-05
size_y = 9.899494936611664e-05
nx = 2
ny = 2
center = [4.949747468305832e-05, 4.949747468305832e-05, 1.979898987322333e-06]

[output]
write_files = true
dir = "outputs/periodic2_zhao_charge_driven_outer_steady_start"
history_stride = 1
write_mesh_potential = true
write_potential_history = true
resume = false
