#:schema https://raw.githubusercontent.com/Nkzono99/BEACH/main/schemas/beach.schema.json

[sim]
dt = 1.0e-10
batch_count = 1
max_step = 20
field_solver = "fmm"
tree_theta = 0.45
tree_leaf_max = 8

[domain]
box_min = [-0.6, -0.6, -0.1]
box_max = [0.6, 0.6, 0.4]
periodic_axes = []

[field_boundary]
mode = "free"

[particle_boundary]
x_low = "open"
x_high = "open"
y_low = "open"
y_high = "open"
z_low = "open"
z_high = "open"

[particles]
[[particles.species]]
enabled = true
source_mode = "volume_seed"
npcls_per_step = 4
q_particle = -1.602176634e-19
m_particle = 9.10938356e-31
pos_low = [-0.2, -0.2, 0.1]
pos_high = [0.2, 0.2, 0.2]
drift_velocity = [0.0, 0.0, -1.0e5]
temperature_k = 0.0

[mesh]
mode = "template"

[[mesh.templates]]
enabled = true
kind = "plane"
surface_model = "insulator"
surface_side = "normal_plus"
center = [0.0, 0.0, 0.0]
size_x = 1.0
size_y = 1.0
nx = 8
ny = 8

[output]
write_files = false
