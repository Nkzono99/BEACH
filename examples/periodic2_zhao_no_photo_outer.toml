#:schema https://raw.githubusercontent.com/Nkzono99/BEACH/main/schemas/beach.schema.json
# Bounded flat-plane smoke for the UV-free, charge-driven Zhao closure.
# The configured ambient densities are quasineutral-region totals. The closure
# derives the incoming electron-reservoir normalization and should leave the
# flat B/C junction for Type C once the tracked current charges the plane.

[sim]
dt = 1.979898987322333e-12
batch_duration = 2.5e-7
batch_count = 4
max_step = 20000
tol_rel = 1.0e-8
b0 = [0.0, 0.0, 0.0]
use_box = true
box_min = [0.0, 0.0, 0.0]
box_max = [9.899494936611664e-05, 9.899494936611664e-05, 2.0e-04]
bc_x_low = "periodic"
bc_x_high = "periodic"
bc_y_low = "periodic"
bc_y_high = "periodic"
bc_z_low = "open"
bc_z_high = "open"
rng_seed = 24604
field_solver = "direct"
field_bc_mode = "periodic2"
sheath_electron_drift_mode = "normal"
sheath_ion_drift_mode = "normal"

[periodic2]
nonzero_mode_backend = "panel_spectral_reference"
zero_mode_policy = "exclude_k0"
lower_boundary_model = "symmetric_vacuum"
reference_mode_layers = 2
panel_quadrature_order = 4
interface_sample_n = 2
interface_phi_tolerance = 1.0e-3
interface_field_tolerance = 1.0e-3

[external_boundary.field]
model = "kinetic_1d"
kinetic_closure = "zhao_charge_driven"
photoelectron_source_scale = 0.0
# Split-interface diagnostic references only. The no-photo Zhao profile instead
# derives its physical Debye length from ambient Te and n_infinity.
debye_length = 10.513585779475326
thermal_voltage = 10.0

[external_boundary.particles]
mode = "same_batch"
field_evolution_timescale = 1.0

[particles]
[[particles.species]]
species_key = "ambient_electron"
enabled = true
source_mode = "reservoir_face"
number_density_cm3 = 8.7
temperature_ev = 12.0
q_particle = -1.602176634e-19
m_particle = 9.10938356e-31
target_macro_particles_per_batch = 64
inject_face = "z_high"
pos_low = [0.0, 0.0, 2.0e-04]
pos_high = [9.899494936611664e-05, 9.899494936611664e-05, 2.0e-04]
drift_velocity = [0.0, 0.0, -4.0529988897111727e5]

[[particles.species]]
species_key = "ambient_proton"
enabled = true
source_mode = "reservoir_face"
number_density_cm3 = 8.7
temperature_ev = 0.1
q_particle = 1.602176634e-19
m_particle = 1.672482821616e-27
target_macro_particles_per_batch = -1
inject_face = "z_high"
pos_low = [0.0, 0.0, 2.0e-04]
pos_high = [9.899494936611664e-05, 9.899494936611664e-05, 2.0e-04]
drift_velocity = [0.0, 0.0, -4.0529988897111727e5]

[mesh]
mode = "template"

[[mesh.templates]]
kind = "plane"
enabled = true
surface_model = "insulator"
surface_side = "normal_plus"
size_x = 9.899494936611664e-05
size_y = 9.899494936611664e-05
nx = 2
ny = 2
center = [4.949747468305832e-05, 4.949747468305832e-05, 1.979898987322333e-06]

[output]
write_files = true
dir = "outputs/periodic2_zhao_no_photo_outer"
history_stride = 1
write_mesh_potential = true
write_potential_history = true
resume = false
