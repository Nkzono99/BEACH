#:schema https://raw.githubusercontent.com/Nkzono99/BEACH/main/schemas/beach.schema.json
# Linearized-photo outer-boundary example. The ambient plasma uses an analytic
# linear Debye response, and the photoelectron emission flux adds a linearized
# mean susceptibility. Tracked photoelectrons still own surface charge updates.

[sim]
dt = 1.0e-9
batch_duration = 1.0e-8
batch_count = 1
max_step = 4
softening = 0.0
field_solver = "direct"
field_bc_mode = "periodic2"
use_box = true
box_min = [0.0, 0.0, 0.0]
box_max = [1.0, 1.0, 1.0]
bc_x_low = "periodic"
bc_x_high = "periodic"
bc_y_low = "periodic"
bc_y_high = "periodic"
bc_z_low = "open"
bc_z_high = "open"

[field]
element_kernel = "triangle_p0"

[periodic2]
nonzero_mode_backend = "panel_spectral_reference"
zero_mode_policy = "exclude_k0"
lower_boundary_model = "symmetric_vacuum"
reference_mode_layers = 2
panel_quadrature_order = 4
interface_sample_n = 2
interface_phi_tolerance = 1.0e-3
interface_field_tolerance = 1.0e-3

[external_boundary.field]
model = "kinetic_1d"
kinetic_closure = "ambient_linear_debye"
photoelectron_density_model = "linearized_mean"
debye_length = 0.2
thermal_voltage = 2.0

[external_boundary.particles]
mode = "same_batch"
field_evolution_timescale = 1.0

[particles]
[[particles.species]]
species_key = "ambient_electron"
enabled = true
source_mode = "reservoir_face"
number_density_m3 = 1.0e6
target_macro_particles_per_batch = 1
q_particle = -1.602176634e-19
m_particle = 9.1093837139e-31
inject_face = "z_high"
pos_low = [0.0, 0.0, 1.0]
pos_high = [1.0, 1.0, 1.0]
drift_velocity = [0.0, 0.0, -1.0e5]
temperature_ev = 2.0

[[particles.species]]
species_key = "ambient_proton"
enabled = true
source_mode = "reservoir_face"
number_density_m3 = 1.0e6
target_macro_particles_per_batch = 1
q_particle = 1.602176634e-19
m_particle = 1.67262192595e-27
inject_face = "z_high"
pos_low = [0.0, 0.0, 1.0]
pos_high = [1.0, 1.0, 1.0]
drift_velocity = [0.0, 0.0, -4.0e4]
temperature_ev = 0.1

[[particles.species]]
species_key = "photoelectron"
enabled = true
source_mode = "photo_raycast"
emit_current_density_a_m2 = 1.0e-6
rays_per_batch = 1
deposit_opposite_charge_on_emit = true
q_particle = -1.602176634e-19
m_particle = 9.1093837139e-31
temperature_ev = 2.2
normal_drift_speed = 0.0
inject_face = "z_high"
pos_low = [0.0, 0.0, 1.0]
pos_high = [1.0, 1.0, 1.0]
ray_direction = [0.0, 0.0, -1.0]

[mesh]
mode = "template"

[[mesh.templates]]
enabled = true
kind = "plane"
surface_model = "insulator"
surface_side = "normal_plus"
center = [0.5, 0.5, 0.25]
size_x = 1.0
size_y = 1.0
nx = 1
ny = 1

[output]
write_files = false
