#:schema https://raw.githubusercontent.com/Nkzono99/BEACH/main/schemas/beach.schema.json

[sim]
dt = 1.0e-7
batch_count = 1
max_step = 10
rng_seed = 12345
field_solver = "fmm"
field_periodic_image_layers = 1
field_periodic_far_correction = "none"

[domain]
box_min = [0.0, 0.0, 0.0]
box_max = [1.0, 1.0, 1.0]
periodic_axes = ["x", "y"]

[field_boundary]
mode = "periodic2"

[particle_boundary]
z_low = "open"
z_high = "open"

[particles]
[[particles.species]]
source_mode = "volume_seed"
q_particle = -1.602176634e-19
m_particle = 9.10938356e-31
w_particle = 1.0
npcls_per_step = 1
pos_low = [0.5, 0.5, 0.8]
pos_high = [0.5, 0.5, 0.8]
drift_velocity = [0.0, 0.0, -1.0e6]
temperature_k = 0.0

[mesh]
mode = "template"

[[mesh.templates]]
kind = "plane"
enabled = true
surface_model = "insulator"
surface_side = "normal_plus"
size_x = 1.0
size_y = 1.0
nx = 4
ny = 4
center = [0.5, 0.5, 0.2]

[output]
write_files = true
dir = "outputs/smoke_single_electron"
history_stride = 1
