#:schema https://raw.githubusercontent.com/Nkzono99/BEACH/main/schemas/beach.schema.json

# Zhao 定常シースを、z-high 面で観測した光電子流出から定期的に解き直す弱連成の例。
# 周期セルは外部シースから見て一様な壁で、外部 Zhao の放出源は H を出た PE だけとする。
# 総電荷は毎 batch の零電流 target が拘束し、外部根は 2 batch ごとに更新する。
# 平板 8x8 の配線確認用であり、研究条件の収束を示すものではない。

[sim]
dt = 2.0e-12
batch_duration = 0.5
batch_count = 6
max_step = 100000
rng_seed = 12345
field_solver = "fmm"
field_periodic_image_layers = 1
field_periodic_far_correction = "cached_kneq0"
field_periodic_ewald_layers = 4
field_periodic_cache_dir = ".beach_cache/periodic2"

[domain]
box_min = [0.0, 0.0, 0.0]
box_max = [1.0e-4, 1.0e-4, 1.0e-3]
periodic_axes = ["x", "y"]

[field_boundary]
mode = "periodic2"

[particle_boundary]
z_low = "open"
z_high = "open"

[reservoir]
inflow_model = "source_vdf"

[periodic2]
nonzero_mode_backend = "cached_kneq0"
zero_mode_policy = "exclude_k0"
lower_boundary_model = "e_bottom_zero"

[surface_current_model]
model = "zhao_stationary"
zhao_branch = "auto"
# 電子にも太陽風の drift を与えるため、上流に接する E^2<0 の帯を |phi_m|(A) / |phi_0|(C) の 10% まで許す。
zhao_upstream_band_tolerance = 0.1
electron_species = "solar_wind_electron"
ion_species = "solar_wind_ion"
photoelectron_species = "photoelectron"
solar_elevation_deg = 60.0
photoelectron_ref_density_m3 = 6.4e7
outflow_refresh_batches = 2

[particles]

[[particles.species]]
species_key = "solar_wind_electron"
number_density_cm3 = 8.7
temperature_ev = 12.0
q_particle = -1.602176634e-19
m_particle = 9.1093837139e-31
target_macro_particles_per_batch = 300
drift_velocity = [0.0, 0.0, -4.0529988897e5]
surface_charge_closure = "fixed_current"

[particles.species.boundary_inflow]
z_high = "reservoir"

[[particles.species]]
species_key = "solar_wind_ion"
number_density_cm3 = 8.7
temperature_ev = 0.1
q_particle = 1.602176634e-19
m_particle = 1.67262192369e-27
target_macro_particles_per_batch = 300
drift_velocity = [0.0, 0.0, -4.0529988897e5]
surface_charge_closure = "fixed_current"

[particles.species.boundary_inflow]
z_high = "reservoir"

[[particles.species]]
species_key = "photoelectron"
source_mode = "photo_raycast"
# 放出VDFはこのMaxwell分布を使い、Zhaoがescape/return barrierと固定電流targetを与える。
emit_current_density_a_m2 = 1.0e-4
rays_per_batch = 300
deposit_opposite_charge_on_emit = true
surface_charge_closure = "fixed_current"
q_particle = -1.602176634e-19
m_particle = 9.1093837139e-31
temperature_ev = 2.2
normal_drift_speed = 0.0
inject_face = "z_high"
pos_low = [0.0, 0.0, 1.0e-3]
pos_high = [1.0e-4, 1.0e-4, 1.0e-3]
ray_direction = [0.0, 0.0, -1.0]

[mesh]
mode = "template"

[[mesh.templates]]
kind = "plane"
enabled = true
surface_model = "insulator"
surface_side = "normal_plus"
size_x = 1.0e-4
size_y = 1.0e-4
nx = 8
ny = 8
center = [5.0e-5, 5.0e-5, 2.0e-6]

[output]
write_files = true
dir = "outputs/periodic2_zhao_outflow_refresh"
history_stride = 1
