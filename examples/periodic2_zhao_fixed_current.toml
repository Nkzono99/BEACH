#:schema https://raw.githubusercontent.com/Nkzono99/BEACH/main/schemas/beach.schema.json

# Zhao の定常シース電流と1-D kinetic barrierを species 別 closure として使う例。
# box外の軌道・turnaround時間・空間電荷は解かず、z-high 面で速度空間へ縮約する。

[sim]
dt = 2.0e-12
batch_duration = 0.5
batch_count = 10
max_step = 100000
rng_seed = 12345
field_solver = "fmm"
field_periodic_image_layers = 1
field_periodic_far_correction = "none"

[domain]
box_min = [0.0, 0.0, 0.0]
box_max = [1.0e-4, 1.0e-4, 1.0e-3]
periodic_axes = ["x", "y"]

[field_boundary]
mode = "periodic2"

[particle_boundary]
z_low = "open"
z_high = "open"

[reservoir]
inflow_model = "source_vdf"

[surface_current_model]
model = "zhao_stationary"
zhao_branch = "auto"
electron_species = "solar_wind_electron"
ion_species = "solar_wind_ion"
photoelectron_species = "photoelectron"
solar_elevation_deg = 60.0
photoelectron_ref_density_m3 = 6.4e7

[particles]

[[particles.species]]
species_key = "solar_wind_electron"
source_mode = "volume_seed"
npcls_per_step = 0
number_density_cm3 = 8.7
temperature_ev = 12.0
q_particle = -1.602176634e-19
m_particle = 9.1093837139e-31
target_macro_particles_per_batch = 300
drift_velocity = [0.0, 0.0, -4.0529988897e5]
surface_charge_closure = "fixed_current"

[particles.species.boundary_inflow]
z_high = "reservoir"

[[particles.species]]
species_key = "solar_wind_ion"
source_mode = "volume_seed"
npcls_per_step = 0
number_density_cm3 = 8.7
temperature_ev = 0.1
q_particle = 1.602176634e-19
m_particle = 1.67262192369e-27
target_macro_particles_per_batch = 300
drift_velocity = [0.0, 0.0, -4.0529988897e5]
surface_charge_closure = "fixed_current"

[particles.species.boundary_inflow]
z_high = "reservoir"

[[particles.species]]
species_key = "photoelectron"
source_mode = "photo_raycast"
# 放出VDFはこのMaxwell分布を使い、Zhaoがescape/return barrierと固定電流targetを与える。
emit_current_density_a_m2 = 1.0e-4
rays_per_batch = 300
deposit_opposite_charge_on_emit = true
surface_charge_closure = "fixed_current"
q_particle = -1.602176634e-19
m_particle = 9.1093837139e-31
temperature_ev = 2.2
normal_drift_speed = 0.0
inject_face = "z_high"
pos_low = [0.0, 0.0, 1.0e-3]
pos_high = [1.0e-4, 1.0e-4, 1.0e-3]
ray_direction = [0.0, 0.0, -1.0]

[mesh]
mode = "template"

[[mesh.templates]]
kind = "plane"
enabled = true
surface_model = "insulator"
surface_side = "normal_plus"
size_x = 1.0e-4
size_y = 1.0e-4
nx = 8
ny = 8
center = [5.0e-5, 5.0e-5, 2.0e-6]

[output]
write_files = true
dir = "outputs/periodic2_zhao_fixed_current"
history_stride = 1
