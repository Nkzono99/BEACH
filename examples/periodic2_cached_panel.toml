#:schema https://raw.githubusercontent.com/Nkzono99/BEACH/main/schemas/beach.schema.json

[sim]
dt = 1.0e-10
batch_count = 1
max_step = 20
softening = 0.0
field_solver = "fmm"
field_bc_mode = "periodic2"
field_periodic_image_layers = 1
field_periodic_far_correction = "cached_kneq0"
field_periodic_ewald_layers = 4
field_periodic_cache_dir = ".beach_cache/periodic2"
field_periodic_generation_tolerance = 1.0e-8
use_box = true
box_min = [0.0, 0.0, 0.0]
box_max = [1.0, 1.0, 1.0]
bc_x_low = "periodic"
bc_x_high = "periodic"
bc_y_low = "periodic"
bc_y_high = "periodic"
bc_z_low = "open"
bc_z_high = "open"

[field]
element_kernel = "triangle_p0"

[particles]
[[particles.species]]
enabled = true
source_mode = "volume_seed"
npcls_per_step = 4
q_particle = -1.602176634e-19
m_particle = 9.10938356e-31
pos_low = [0.2, 0.2, 0.4]
pos_high = [0.8, 0.8, 0.8]
drift_velocity = [0.0, 0.0, -1.0e5]
temperature_k = 0.0

[mesh]
mode = "template"

[[mesh.templates]]
enabled = true
kind = "plane"
surface_model = "insulator"
surface_side = "normal_plus"
center = [0.5, 0.5, 0.25]
size_x = 1.0
size_y = 1.0
nx = 8
ny = 8

[output]
write_files = false
