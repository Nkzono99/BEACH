#:schema https://raw.githubusercontent.com/Nkzono99/BEACH/main/schemas/beach.schema.json

# CSV-free smoke case for the implicit matching-plane zero mode.
# BEACH evaluates Zhao online and brackets the backward-Euler endpoint itself.
# This small case checks wiring; it is not a converged physical production case.

[sim]
dt = 2.0e-12
batch_duration = 1.0e-8
batch_count = 2
max_step = 4000
rng_seed = 12345
field_solver = "fmm"
field_periodic_image_layers = 1
field_periodic_far_correction = "cached_kneq0"
field_periodic_ewald_layers = 4
field_periodic_cache_dir = ".beach_cache/periodic2"

[domain]
box_min = [0.0, 0.0, 0.0]
box_max = [1.0e-4, 1.0e-4, 1.0e-3]
periodic_axes = ["x", "y"]

[field_boundary]
mode = "periodic2"

[particle_boundary]
z_low = "open"
z_high = "open"
ordinary_open_model = "escape"

[reservoir]
inflow_model = "source_vdf"

[periodic2]
nonzero_mode_backend = "cached_kneq0"
zero_mode_policy = "exclude_k0"
lower_boundary_model = "e_bottom_zero"

[surface_current_model]
model = "matching_plane_quasistatic"
response_backend = "zhao_online"
zhao_branch = "auto"
electron_species = "solar_wind_electron"
ion_species = "solar_wind_ion"
implicit_zero_mode = true
coupling_rtol = 1.0e-4
coupling_atol = [0.0, 0.0, 0.0, 0.0]
coupling_max_iterations = 20
coupling_relaxation = 0.5

[particles]

[[particles.species]]
species_key = "solar_wind_electron"
source_mode = "volume_seed"
npcls_per_step = 0
number_density_cm3 = 5.0
temperature_ev = 10.0
q_particle = -1.602176634e-19
m_particle = 9.1093837139e-31
target_macro_particles_per_batch = 300
drift_velocity = [0.0, 0.0, -4.0e5]
surface_charge_closure = "explicit"

[particles.species.boundary_inflow]
z_high = "reservoir"

[[particles.species]]
species_key = "solar_wind_ion"
source_mode = "volume_seed"
npcls_per_step = 0
number_density_cm3 = 5.0
temperature_ev = 0.1
q_particle = 1.602176634e-19
m_particle = 1.67262192369e-27
target_macro_particles_per_batch = 300
drift_velocity = [0.0, 0.0, -4.0e5]
surface_charge_closure = "explicit"

[particles.species.boundary_inflow]
z_high = "reservoir"

[mesh]
mode = "template"

[[mesh.templates]]
kind = "plane"
enabled = true
surface_model = "insulator"
surface_side = "normal_plus"
size_x = 1.0e-4
size_y = 1.0e-4
nx = 8
ny = 8
center = [5.0e-5, 5.0e-5, 2.0e-6]

[output]
write_files = true
write_mesh_potential = true
write_potential_history = true
dir = "outputs/periodic2_matching_plane_zhao_implicit"
history_stride = 1
