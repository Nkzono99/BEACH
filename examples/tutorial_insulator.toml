#:schema https://raw.githubusercontent.com/Nkzono99/BEACH/main/schemas/beach.schema.json

[sim]
dt = 1.0e-7
batch_count = 1
max_step = 10
softening = 1.0e-6
use_box = true
box_min = [0.0, 0.0, 0.0]
box_max = [1.0, 1.0, 1.0]
bc_x_low = "periodic"
bc_x_high = "periodic"
bc_y_low = "periodic"
bc_y_high = "periodic"
bc_z_low = "open"
bc_z_high = "open"
rng_seed = 12345
field_solver = "fmm"
field_bc_mode = "periodic2"
field_periodic_image_layers = 1
field_periodic_far_correction = "none"

[particles]
[[particles.species]]
source_mode = "volume_seed"
q_particle = -1.602176634e-19
m_particle = 9.10938356e-31
w_particle = 1.0
npcls_per_step = 1
pos_low = [0.5, 0.5, 0.8]
pos_high = [0.5, 0.5, 0.8]
drift_velocity = [0.0, 0.0, -1.0e6]
temperature_k = 0.0

[mesh]
mode = "template"

[[mesh.templates]]
kind = "plane"
enabled = true
surface_model = "insulator"
size_x = 1.0
size_y = 1.0
nx = 4
ny = 4
center = [0.5, 0.5, 0.2]

[output]
write_files = true
dir = "outputs/latest"
history_stride = 1
