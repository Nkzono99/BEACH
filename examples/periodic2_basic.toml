#:schema https://raw.githubusercontent.com/Nkzono99/BEACH/main/schemas/beach.schema.json
# Generated by beachx config init

[run]
batch_count = 100
rng_seed = 12345

[run.batch]
duration_steps = 60000.0

[domain]
box_min = [
    0.0,
    0.0,
    0.0,
]
box_max = [
    1.0,
    1.0,
    10.0,
]
periodic_axes = [
    "x",
    "y",
]

[[mesh.parts]]
kind = "plane"
enabled = true
surface_model = "insulator"
surface_side = "normal_plus"
size_x = 1.0
size_y = 1.0
nx = 20
ny = 20
center = [
    0.5,
    0.5,
    0.0,
]

[particles.tracking]
dt_s = 2e-08
max_steps_per_particle = 10000

[particles.boundary]
z_low = "open"
z_high = "open"

[[particles.species]]
charge_c = -1.602176634e-19
mass_kg = 9.10938356e-31

[particles.species.source]
mode = "volume_seed"

[particles.species.sampling]
volume_macro_particles_per_batch = 10

[[particles.species]]
charge_c = 1.602176634e-19
mass_kg = 1.672482821616e-27

[particles.species.source]
mode = "volume_seed"

[particles.species.sampling]
volume_macro_particles_per_batch = 10

[fields]
boundary = "periodic2"

[fields.solver]
method = "fmm"

[fields.periodic]
backend = "finite_images"

[output]
enabled = true
dir = "outputs/periodic2_basic"

[output.history]
stride_batches = 1
