[build-system]
requires = ["setuptools>=77", "wheel", "fpm"]
build-backend = "setuptools.build_meta"

[project]
name = "beach-bem"
version = "4.0.0"
description = "BEACH (BEM + Accumulated CHarge): BEM surface-charging + test-particle prototype (insulator mode) with hybrid E-field and Boris pusher."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.0",
    "matplotlib>=3.8",
    "numpy>=1.24",
    "tomli>=2.0.1; python_version < '3.11'",
    "tomli-w>=1.0.0",
]

[project.urls]
Homepage = "https://nkzono99.github.io/BEACH/"
Documentation = "https://nkzono99.github.io/BEACH/"
Repository = "https://github.com/Nkzono99/BEACH"
Issues = "https://github.com/Nkzono99/BEACH/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-jsonschema>=4.0",
    # Runs the runops adapter tests (beach.tooling.runops_adapter targets the v2 contract).
    "runops>=2.0,<3",
]
accel = [
    "numba>=0.59",
]
docs = [
    "sphinx>=8,<9",
]

[project.scripts]
beachx = "beach.cli.main:main"

[project.entry-points."runops.adapters"]
beach = "beach.tooling.runops_adapter:Adapter"

[tool.setuptools]
packages = [
    "beach",
    "beach.io",
    "beach.native",
    "beach.analysis",
    "beach.plot",
    "beach.tooling",
    "beach.cli",
    "beach.config",
    "beach.agent_context",
]

[tool.setuptools.package-dir]
# Data-only package: agent skills/references deployed by runops (beach/tooling/runops_adapter.py).
"beach.agent_context" = "plugins/beach-context"

[tool.setuptools.package-data]
"beach" = ["include/*.h"]
"beach.config" = ["schemas/*.json"]
"beach.agent_context" = ["skills/*/*", "references/*", "references/*/*", "docs/*"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
markers = [
    "workflow: full periodic-validation staging, provenance, and analysis contracts",
    "smoke: representative workflow contracts included in the development loop",
    "native: needs the native field kernel (field_kernel_library fixture); make test-python-native",
    "config_native: needs the Fortran config checker (native_checker fixture); make test-config-contract",
    "field_kernel_cache: generates real periodic caches; make test-field-kernel-cache",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Correctness checks only (pyflakes, pycodestyle errors); style rules are not enforced.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
files = [
    "beach/io/summary.py",
    "beach/config/_shared.py",
    "beach/config/schema.py",
]
strict = true
follow_imports = "silent"
