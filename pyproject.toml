[build-system]
requires = ["setuptools>=77", "wheel", "fpm"]
build-backend = "setuptools.build_meta"

[project]
name = "beach-bem"
version = "1.6.2"
description = "BEACH (BEM + Accumulated CHarge): BEM surface-charging + test-particle prototype (insulator mode) with hybrid E-field and Boris pusher."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.0",
    "matplotlib>=3.8",
    "numpy>=1.24",
    "tomli>=2.0.1; python_version < '3.11'",
    "tomli-w>=1.0.0",
]

[project.urls]
Homepage = "https://nkzono99.github.io/BEACH/"
Documentation = "https://nkzono99.github.io/BEACH/"
Repository = "https://github.com/Nkzono99/BEACH"
Issues = "https://github.com/Nkzono99/BEACH/issues"

[project.optional-dependencies]
accel = [
    "numba>=0.59",
]

[project.scripts]
beachx = "beach.cli.main:main"
beach-inspect = "beach.cli.legacy:inspect_main"
beach-animate-history = "beach.cli.legacy:animate_main"
beach-plot-coulomb-force-matrix = "beach.cli.legacy:coulomb_main"
beach-plot-potential-slices = "beach.cli.legacy:slices_main"
beach-estimate-workload = "beach.cli.legacy:workload_main"
beach-plot-performance-profile = "beach.cli.legacy:profile_main"

[tool.setuptools]
packages = ["beach", "beach.fortran_results", "beach.cli", "beach.config"]

[tool.setuptools.package-data]
"beach" = ["include/*.h"]
"beach.config" = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
