<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc">
<title id="title">checkpoint から累積バッチ数の続きへ</title>
<desc id="desc">最終出力と二つのスロットの完全な候補を検査し、最大バッチ数Bの状態から累積Nバッチまで続行する図。</desc>
<defs><marker id="64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="2563b0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563b0"/></marker><marker id="c44343" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c44343"/></marker><marker id="087f83" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087f83"/></marker><marker id="a66a08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a66a08"/></marker><marker id="203047" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#203047"/></marker></defs>
<g font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans CJK JP', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif">
<rect x="1" y="1" width="958" height="538" rx="20" fill="#ffffff" stroke="#dbe3eb" stroke-width="2"/>
<text x="28" y="43" font-size="28" fill="#203047" text-anchor="start" font-weight="700">checkpoint から累積バッチ数の続きへ</text>
<text x="932" y="72" font-size="17" fill="#64748b" text-anchor="end">模式図・縮尺なし</text>
<rect x="28" y="113" width="275" height="151" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="165.5" y="147" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">読み込み元を検査</text><text x="165.5" y="179" font-size="20" fill="#64748b" text-anchor="middle">直下の最終出力</text>
<text x="165.5" y="207" font-size="20" fill="#64748b" text-anchor="middle">checkpoints/slot0/</text>
<text x="165.5" y="235" font-size="20" fill="#64748b" text-anchor="middle">checkpoints/slot1/</text><rect x="354" y="113" width="252" height="151" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="480.0" y="147" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">完全な候補を選ぶ</text><text x="480.0" y="179" font-size="20" fill="#64748b" text-anchor="middle">読み込める候補のうち</text>
<text x="480.0" y="207" font-size="20" fill="#64748b" text-anchor="middle">完了バッチ数が最大</text>
<text x="480.0" y="235" font-size="20" fill="#64748b" text-anchor="middle">保存済み：B バッチ</text><rect x="660" y="113" width="272" height="151" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="796.0" y="147" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">状態を復元</text><text x="796.0" y="179" font-size="20" fill="#64748b" text-anchor="middle">表面電荷・累積統計</text>
<text x="796.0" y="207" font-size="20" fill="#64748b" text-anchor="middle">必要な端数・台帳</text>
<text x="796.0" y="235" font-size="20" fill="#64748b" text-anchor="middle">飛行中粒子は持ち越さない</text><path d="M305 190 L351 190" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><path d="M608 190 L657 190" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><rect x="354" y="341" width="252" height="110" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="480.0" y="375" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">累積 N バッチで終了</text><text x="480.0" y="407" font-size="20" fill="#64748b" text-anchor="middle">追加するのは N − B 回</text><rect x="660" y="341" width="272" height="110" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="796.0" y="375" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">B + 1 から続行</text><text x="796.0" y="407" font-size="20" fill="#64748b" text-anchor="middle">新しい output.dir へ出力</text><path d="M796 267 L796 337" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><path d="M657 395 L610 395" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><text x="32" y="359" font-size="24" fill="#203047" text-anchor="start">例：150 → 151</text>
<text x="32" y="398" font-size="24" fill="#203047" text-anchor="start">追加は 1 バッチ</text><text x="480" y="502" font-size="22" fill="#64748b" text-anchor="middle">読み込み元は run.restart.from、到達回数は run.batch_count。</text>
</g>
</svg>
