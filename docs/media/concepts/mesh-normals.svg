<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="960" height="510" role="img" aria-labelledby="title desc">
<title id="title">三角形の電荷と真空側の向き</title>
<desc id="desc">三角形の総電荷と一定面密度、開いた面の正負法線、閉じた面の外向き真空側を比較する図。</desc>
<defs><marker id="64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="2563b0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563b0"/></marker><marker id="c44343" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c44343"/></marker><marker id="087f83" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087f83"/></marker><marker id="a66a08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a66a08"/></marker><marker id="203047" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#203047"/></marker></defs>
<g font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans CJK JP', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif">
<rect x="1" y="1" width="958" height="508" rx="20" fill="#ffffff" stroke="#dbe3eb" stroke-width="2"/>
<text x="28" y="43" font-size="28" fill="#203047" text-anchor="start" font-weight="700">三角形の電荷と真空側の向き</text>
<text x="932" y="72" font-size="17" fill="#64748b" text-anchor="end">模式図・縮尺なし</text>
<rect x="24" y="96" width="284" height="346" rx="12" fill="#f3f6fa" stroke="#cbd5e1" stroke-width="2"/><rect x="338" y="96" width="284" height="346" rx="12" fill="#f3f6fa" stroke="#cbd5e1" stroke-width="2"/><rect x="652" y="96" width="284" height="346" rx="12" fill="#f3f6fa" stroke="#cbd5e1" stroke-width="2"/><text x="166" y="133" font-size="24" fill="#203047" text-anchor="middle" font-weight="700">三角形要素</text><polygon points="65,289 136,181 273,289" fill="#d9eeee" stroke="#087f83" stroke-width="2"/><text x="150" y="246" font-size="29" fill="#087f83" text-anchor="middle">qᵢ</text><text x="166" y="338" font-size="20" fill="#203047" text-anchor="middle">面積 Aᵢ、総電荷 qᵢ</text>
<text x="166" y="370" font-size="20" fill="#203047" text-anchor="middle">一定面密度 σᵢ = qᵢ / Aᵢ</text><text x="480" y="133" font-size="24" fill="#203047" text-anchor="middle" font-weight="700">開いた面</text><polygon points="365,288 405,236 595,236 555,288" fill="#d9eeee" stroke="#087f83" stroke-width="2"/><path d="M405 236 L555 288 M480.0 236 L440.0 288" fill="none" stroke="#087f83" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M400 244 L400 168" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><path d="M400 284 L400 357" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><text x="419" y="184" font-size="22" fill="#087f83" text-anchor="start">+n</text><text x="419" y="351" font-size="22" fill="#087f83" text-anchor="start">−n</text><text x="480" y="218" font-size="21" fill="#203047" text-anchor="middle">normal_plus</text><text x="480" y="396" font-size="21" fill="#203047" text-anchor="middle">normal_minus</text><text x="794" y="133" font-size="24" fill="#203047" text-anchor="middle" font-weight="700">閉じた面</text><polygon points="794,185 867,251 794,319 721,251" fill="#d9eeee" stroke="#087f83" stroke-width="2"/><path d="M794 185 L794 319 M721 251 L867 251" fill="none" stroke="#087f83" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M794 185 L794 155" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><path d="M867 251 L911 251" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><path d="M721 251 L677 251" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><path d="M794 319 L794 350" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><text x="794" y="387" font-size="19" fill="#203047" text-anchor="middle">outward_closed</text>
<text x="794" y="416" font-size="19" fill="#203047" text-anchor="middle">閉じた整合面の外を真空側に</text><text x="30" y="476" font-size="21" fill="#64748b" text-anchor="start">surface_side は場の片側極限の向き。三角形の頂点順序を変更しない。</text>
</g>
</svg>
