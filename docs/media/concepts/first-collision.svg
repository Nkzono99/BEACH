<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 605" width="960" height="605" role="img" aria-labelledby="title desc">
<title id="title">候補軌道のうち最初の交差までを確定する</title>
<desc id="desc">候補軌道線分が三角形へ先に当たれば吸収し、box反射面が先なら交差で折り返して残り時間の候補を作り直す図。</desc>
<defs><marker id="64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="2563b0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563b0"/></marker><marker id="c44343" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c44343"/></marker><marker id="087f83" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087f83"/></marker><marker id="a66a08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a66a08"/></marker><marker id="203047" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#203047"/></marker></defs>
<g font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans CJK JP', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif">
<rect x="1" y="1" width="958" height="603" rx="20" fill="#ffffff" stroke="#dbe3eb" stroke-width="2"/>
<text x="28" y="43" font-size="28" fill="#203047" text-anchor="start" font-weight="700">候補軌道のうち最初の交差までを確定する</text>
<text x="932" y="72" font-size="17" fill="#64748b" text-anchor="end">模式図・縮尺なし</text>
<text x="37" y="118" font-size="24" fill="#203047" text-anchor="start" font-weight="700">三角形が先：最初の命中で吸収</text><polygon points="319,147 426,250 276,250" fill="#d9eeee" stroke="#087f83" stroke-width="2"/><path d="M685 143 L685 260" fill="none" stroke="#087f83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M97 218 L337 218" fill="none" stroke="#2563b0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#2563b0)"/><path d="M339 218 L852 218" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/><circle cx="97" cy="218" r="12" fill="#2563b0"/><text x="97" y="224" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">−</text><circle cx="337" cy="218" r="12" fill="#2563b0"/><text x="337" y="224" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">×</text><text x="90" y="183" font-size="22" fill="#203047" text-anchor="start">x₀</text><text x="851" y="184" font-size="22" fill="#203047" text-anchor="end">候補 x₁</text><text x="353" y="280" font-size="20" fill="#2563b0" text-anchor="middle">命中位置</text><text x="688" y="280" font-size="20" fill="#087f83" text-anchor="middle">box 面</text><text x="37" y="341" font-size="24" fill="#203047" text-anchor="start" font-weight="700">反射面が先：交差で折り返し、残り時間を再積分</text><path d="M592 368 L592 519" fill="none" stroke="#087f83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M104 491 L588 399" fill="none" stroke="#2563b0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#2563b0)"/><path d="M592 399 L830 354" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/><path d="M588 399 L333 372" fill="none" stroke="#2563b0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#2563b0)"/><circle cx="104" cy="491" r="12" fill="#2563b0"/><text x="104" y="497" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">−</text><text x="628" y="435" font-size="21" fill="#087f83" text-anchor="start">反射面</text><text x="321" y="412" font-size="21" fill="#2563b0" text-anchor="middle">新しい候補線分</text><text x="480" y="565" font-size="20" fill="#64748b" text-anchor="middle">灰の破線は未採用の候補部分。同時刻（許容差内）なら三角形を優先。</text>
</g>
</svg>
