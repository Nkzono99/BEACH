<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 515" width="960" height="515" role="img" aria-labelledby="title desc">
<title id="title">吸収した電荷を局所に残すか、再配分するか</title>
<desc id="desc">絶縁体は命中要素に負電荷を残し、浮遊導体は同じ物体の総電荷を保ちながら等電位へ再配分する比較図。</desc>
<defs><marker id="64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="2563b0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563b0"/></marker><marker id="c44343" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c44343"/></marker><marker id="087f83" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087f83"/></marker><marker id="a66a08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a66a08"/></marker><marker id="203047" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#203047"/></marker></defs>
<g font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans CJK JP', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif">
<rect x="1" y="1" width="958" height="513" rx="20" fill="#ffffff" stroke="#dbe3eb" stroke-width="2"/>
<text x="28" y="43" font-size="28" fill="#203047" text-anchor="start" font-weight="700">吸収した電荷を局所に残すか、再配分するか</text>
<text x="932" y="72" font-size="17" fill="#64748b" text-anchor="end">模式図・縮尺なし</text>
<rect x="25" y="96" width="440" height="348" rx="12" fill="#f3f6fa" stroke="#cbd5e1" stroke-width="2"/><rect x="495" y="96" width="440" height="348" rx="12" fill="#f3f6fa" stroke="#cbd5e1" stroke-width="2"/><text x="245" y="137" font-size="25" fill="#203047" text-anchor="middle" font-weight="700">絶縁体：insulator</text><text x="715" y="137" font-size="25" fill="#203047" text-anchor="middle" font-weight="700">浮遊導体：conductor</text><polygon points="79,348 119,248 419,248 379,348" fill="#d9eeee" stroke="#087f83" stroke-width="2"/><path d="M119 248 L379 348 M249.0 248 L209.0 348" fill="none" stroke="#087f83" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><polygon points="549,348 589,248 889,248 849,348" fill="#d9eeee" stroke="#087f83" stroke-width="2"/><path d="M589 248 L849 348 M719.0 248 L679.0 348" fill="none" stroke="#087f83" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M190 178 L210 270" fill="none" stroke="#2563b0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#2563b0)"/><circle cx="190" cy="177" r="12" fill="#2563b0"/><text x="190" y="183" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">−</text><circle cx="213" cy="282" r="12" fill="#2563b0"/><text x="213" y="288" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">−</text><path d="M665 178 L685 263" fill="none" stroke="#2563b0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#2563b0)"/><circle cx="665" cy="177" r="12" fill="#2563b0"/><text x="665" y="183" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">−</text><circle cx="577" cy="315" r="10" fill="#2563b0"/><text x="577" y="321" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">−</text><circle cx="633" cy="291" r="10" fill="#2563b0"/><text x="633" y="297" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">−</text><circle cx="756" cy="277" r="10" fill="#2563b0"/><text x="756" y="283" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">−</text><circle cx="829" cy="312" r="10" fill="#2563b0"/><text x="829" y="318" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">−</text><text x="245" y="386" font-size="21" fill="#203047" text-anchor="middle">命中した要素へ保持</text>
<text x="245" y="416" font-size="21" fill="#203047" text-anchor="middle">面に沿った再配分はしない</text><text x="715" y="386" font-size="21" fill="#203047" text-anchor="middle">同じ mesh_id の総電荷を保存</text>
<text x="715" y="416" font-size="21" fill="#203047" text-anchor="middle">要素重心の電位を等しくする</text><text x="480" y="480" font-size="20" fill="#64748b" text-anchor="middle">− は負電荷の分布の模式記号。導体でも電荷密度は一様とは限らない。</text>
</g>
</svg>
