<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 525" width="960" height="525" role="img" aria-labelledby="title desc">
<title id="title">保存値から図へ、必要なら場の再構成へ</title>
<desc id="desc">出力ファイルから保存電荷と最終電位を読む経路と、native kernelで電位履歴や断面を再構成する経路の図。</desc>
<defs><marker id="64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="2563b0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563b0"/></marker><marker id="c44343" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c44343"/></marker><marker id="087f83" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087f83"/></marker><marker id="a66a08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a66a08"/></marker><marker id="203047" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#203047"/></marker></defs>
<g font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans CJK JP', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif">
<rect x="1" y="1" width="958" height="523" rx="20" fill="#ffffff" stroke="#dbe3eb" stroke-width="2"/>
<text x="28" y="43" font-size="28" fill="#203047" text-anchor="start" font-weight="700">保存値から図へ、必要なら場の再構成へ</text>
<text x="932" y="72" font-size="17" fill="#64748b" text-anchor="end">模式図・縮尺なし</text>
<rect x="28" y="185" width="230" height="120" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="143.0" y="219" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">保存した出力</text><text x="143.0" y="251" font-size="20" fill="#64748b" text-anchor="middle">電荷・メッシュ・履歴</text>
<text x="143.0" y="279" font-size="20" fill="#64748b" text-anchor="middle">実行時の場の設定</text><rect x="331" y="105" width="274" height="130" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="468.0" y="139" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">保存値を読む</text><text x="468.0" y="171" font-size="20" fill="#64748b" text-anchor="middle">beachx inspect</text>
<text x="468.0" y="199" font-size="20" fill="#64748b" text-anchor="middle">Beach / run.result</text>
<text x="468.0" y="227" font-size="20" fill="#64748b" text-anchor="middle">保存済み電荷・最終電位</text><rect x="331" y="310" width="274" height="130" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="468.0" y="344" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">場を再構成する</text><text x="468.0" y="376" font-size="20" fill="#64748b" text-anchor="middle">native field kernel</text>
<text x="468.0" y="404" font-size="20" fill="#64748b" text-anchor="middle">保存電荷 + 場の設定</text><rect x="681" y="105" width="250" height="130" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="806.0" y="139" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">基本の図・集計</text><text x="806.0" y="171" font-size="20" fill="#64748b" text-anchor="middle">電荷分布・電荷動画</text>
<text x="806.0" y="199" font-size="20" fill="#64748b" text-anchor="middle">保存済み最終電位</text><rect x="681" y="310" width="250" height="130" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="806.0" y="344" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">追加の解析</text><text x="806.0" y="376" font-size="20" fill="#64748b" text-anchor="middle">電位履歴の再構成</text>
<text x="806.0" y="404" font-size="20" fill="#64748b" text-anchor="middle">任意断面の電位</text><path d="M258 223 L294 223 L294 170 L327 170" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><path d="M258 269 L294 269 L294 375 L327 375" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><path d="M606 170 L676 170" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><path d="M606 375 L676 375" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><text x="480" y="488" font-size="21" fill="#64748b" text-anchor="middle">下段だけ共有 field kernel が必要。保存済みの電位を読む経路と区別する。</text>
</g>
</svg>
