<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="960" height="510" role="img" aria-labelledby="title desc">
<title id="title">同じ表面電荷を、どう足し合わせるか</title>
<desc id="desc">Directの全三角形和、Treecodeの遠方群の単極近似、FMMの局所展開を比較する図。</desc>
<defs><marker id="64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="2563b0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563b0"/></marker><marker id="c44343" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c44343"/></marker><marker id="087f83" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087f83"/></marker><marker id="a66a08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a66a08"/></marker><marker id="203047" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#203047"/></marker></defs>
<g font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans CJK JP', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif">
<rect x="1" y="1" width="958" height="508" rx="20" fill="#ffffff" stroke="#dbe3eb" stroke-width="2"/>
<text x="28" y="43" font-size="28" fill="#203047" text-anchor="start" font-weight="700">同じ表面電荷を、どう足し合わせるか</text>
<text x="932" y="72" font-size="17" fill="#64748b" text-anchor="end">模式図・縮尺なし</text>
<rect x="24" y="98" width="280" height="334" rx="12" fill="#f3f6fa" stroke="#cbd5e1" stroke-width="2"/><text x="164" y="136" font-size="26" fill="#203047" text-anchor="middle" font-weight="700">Direct</text><polygon points="67,225 85,205 100,225" fill="#d9eeee" stroke="#087f83" stroke-width="2"/><polygon points="114,265 132,245 147,265" fill="#d9eeee" stroke="#087f83" stroke-width="2"/><polygon points="66,307 84,287 99,307" fill="#d9eeee" stroke="#087f83" stroke-width="2"/><circle cx="252" cy="249" r="12" fill="#087f83"/><text x="252" y="255" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">•</text><text x="252" y="288" font-size="18" fill="#64748b" text-anchor="middle">評価点</text><rect x="340" y="98" width="280" height="334" rx="12" fill="#f3f6fa" stroke="#cbd5e1" stroke-width="2"/><text x="480" y="136" font-size="26" fill="#203047" text-anchor="middle" font-weight="700">Treecode</text><polygon points="383,225 401,205 416,225" fill="#d9eeee" stroke="#087f83" stroke-width="2"/><polygon points="430,265 448,245 463,265" fill="#d9eeee" stroke="#087f83" stroke-width="2"/><polygon points="382,307 400,287 415,307" fill="#d9eeee" stroke="#087f83" stroke-width="2"/><circle cx="568" cy="249" r="12" fill="#087f83"/><text x="568" y="255" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">•</text><text x="568" y="288" font-size="18" fill="#64748b" text-anchor="middle">評価点</text><rect x="656" y="98" width="280" height="334" rx="12" fill="#f3f6fa" stroke="#cbd5e1" stroke-width="2"/><text x="796" y="136" font-size="26" fill="#203047" text-anchor="middle" font-weight="700">FMM</text><polygon points="699,225 717,205 732,225" fill="#d9eeee" stroke="#087f83" stroke-width="2"/><polygon points="746,265 764,245 779,265" fill="#d9eeee" stroke="#087f83" stroke-width="2"/><polygon points="698,307 716,287 731,307" fill="#d9eeee" stroke="#087f83" stroke-width="2"/><circle cx="884" cy="249" r="12" fill="#087f83"/><text x="884" y="255" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">•</text><text x="884" y="288" font-size="18" fill="#64748b" text-anchor="middle">評価点</text><path d="M147 215 L239 247" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#64748b)"/><path d="M147 255 L239 247" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#64748b)"/><path d="M147 297 L239 247" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#64748b)"/><text x="164" y="354" font-size="21" fill="#203047" text-anchor="middle">全要素の寄与を足す</text>
<text x="164" y="387" font-size="21" fill="#203047" text-anchor="middle">解析的な三角形積分</text><rect x="369" y="195" width="108" height="128" rx="12" fill="none" stroke="#087f83" stroke-width="2"/><path d="M478 250 L555 250" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><text x="480" y="354" font-size="20" fill="#203047" text-anchor="middle">遠い群を 1 点で近似</text>
<text x="480" y="387" font-size="20" fill="#203047" text-anchor="middle">近傍・相殺する群は分解</text><rect x="685" y="195" width="108" height="128" rx="12" fill="none" stroke="#087f83" stroke-width="2"/><rect x="840" y="205" width="72" height="96" rx="12" fill="none" stroke="#087f83" stroke-width="2"/><path d="M796 250 L837 250" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><text x="796" y="354" font-size="20" fill="#203047" text-anchor="middle">遠い群 → 局所展開</text>
<text x="796" y="387" font-size="20" fill="#203047" text-anchor="middle">近傍は三角形の直接和</text><text x="480" y="475" font-size="22" fill="#087f83" text-anchor="middle">すべて同じ三角形 P0 面電荷を使う。場境界の選択は別。</text>
</g>
</svg>
