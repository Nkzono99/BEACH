<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" role="img" aria-labelledby="title desc">
<title id="title">表面の帯電と粒子軌道がつながる</title>
<desc id="desc">電子と正イオンが三角形表面へ入射し、表面電荷から場と軌道、次の表面電荷へ循環する模式図。</desc>
<defs><marker id="64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="2563b0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563b0"/></marker><marker id="c44343" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c44343"/></marker><marker id="087f83" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087f83"/></marker><marker id="a66a08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a66a08"/></marker><marker id="203047" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#203047"/></marker></defs>
<g font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans CJK JP', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif">
<rect x="1" y="1" width="958" height="528" rx="20" fill="#ffffff" stroke="#dbe3eb" stroke-width="2"/>
<text x="28" y="43" font-size="28" fill="#203047" text-anchor="start" font-weight="700">表面の帯電と粒子軌道がつながる</text>
<text x="932" y="72" font-size="17" fill="#64748b" text-anchor="end">模式図・縮尺なし</text>
<polygon points="85,400 125,300 515,300 475,400" fill="#d9eeee" stroke="#087f83" stroke-width="2"/><path d="M125 300 L475 400 M300.0 300 L260.0 400" fill="none" stroke="#087f83" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="116" font-size="23" fill="#203047" text-anchor="start">表面電荷が軌道を変える</text>
<text x="72" y="146" font-size="23" fill="#203047" text-anchor="start">吸収・放出が次の場を変える</text><path d="M105 175 C100 220 200 225 195 305" fill="none" stroke="#2563b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#2563b0)"/><path d="M290 170 C280 240 360 230 395 168" fill="none" stroke="#2563b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#2563b0)"/><path d="M460 185 C460 240 425 270 410 310" fill="none" stroke="#c44343" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#c44343)"/><circle cx="105" cy="175" r="12" fill="#2563b0"/><text x="105" y="181" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">−</text><circle cx="290" cy="170" r="12" fill="#2563b0"/><text x="290" y="176" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">−</text><circle cx="460" cy="185" r="12" fill="#c44343"/><text x="460" y="191" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">+</text><path d="M245 200 L248 280" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#64748b)"/><path d="M365 210 L348 283" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#64748b)"/><text x="280" y="275" font-size="20" fill="#64748b" text-anchor="start">電場</text><circle cx="162" cy="349" r="12" fill="#2563b0"/><text x="162" y="355" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">−</text><circle cx="258" cy="338" r="12" fill="#2563b0"/><text x="258" y="344" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">−</text><circle cx="368" cy="366" r="12" fill="#2563b0"/><text x="368" y="372" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">−</text><text x="92" y="435" font-size="23" fill="#087f83" text-anchor="start">三角形ごとの表面電荷</text><rect x="600" y="104" width="320" height="82" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="760.0" y="138" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">現在の表面電荷</text><path d="M760 186 L760 218" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#64748b)"/><rect x="600" y="220" width="320" height="82" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="760.0" y="254" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">場 → 粒子の軌道</text><path d="M760 302 L760 334" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#64748b)"/><rect x="600" y="336" width="320" height="82" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="760.0" y="370" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">吸収・放出の電荷を反映</text><path d="M920 377 L940 377 L940 145 L920 145" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><text x="600" y="452" font-size="18" fill="#64748b" text-anchor="start">青 −：電子・負電荷</text>
<text x="600" y="479" font-size="18" fill="#64748b" text-anchor="start">赤 +：正イオン・正電荷</text><text x="72" y="505" font-size="20" fill="#64748b" text-anchor="start">粒子の空間電荷は場の源に含めない</text>
</g>
</svg>
