<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="title desc">
<title id="title">適応進行：受理した試行だけを残す</title>
<desc id="desc">適応バッチの候補電荷を検査し、受理なら確定反映、棄却なら開始状態へ戻して幅を半分にして再試行する図。</desc>
<defs><marker id="64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="2563b0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563b0"/></marker><marker id="c44343" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c44343"/></marker><marker id="087f83" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087f83"/></marker><marker id="a66a08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a66a08"/></marker><marker id="203047" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#203047"/></marker></defs>
<g font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans CJK JP', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif">
<rect x="1" y="1" width="958" height="518" rx="20" fill="#ffffff" stroke="#dbe3eb" stroke-width="2"/>
<text x="28" y="43" font-size="28" fill="#203047" text-anchor="start" font-weight="700">適応進行：受理した試行だけを残す</text>
<text x="932" y="72" font-size="17" fill="#64748b" text-anchor="end">模式図・縮尺なし</text>
<rect x="28" y="120" width="255" height="110" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="155.5" y="154" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">バッチ開始状態</text><text x="155.5" y="186" font-size="20" fill="#64748b" text-anchor="middle">電荷・粒子数の端数</text>
<text x="155.5" y="214" font-size="20" fill="#64748b" text-anchor="middle">試行幅 h = h₀</text><rect x="353" y="120" width="245" height="110" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="475.5" y="154" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">固定した場で追跡</text><text x="475.5" y="186" font-size="20" fill="#64748b" text-anchor="middle">候補電荷を作る</text><path d="M284 176 L349 176" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><rect x="665" y="120" width="268" height="110" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="799.0" y="154" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">電位変化を検査</text><text x="799.0" y="186" font-size="20" fill="#64748b" text-anchor="middle">max |Δφₖ≠₀| ≤ 上限</text><path d="M600 176 L661 176" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><path d="M800 231 L800 312" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><text x="817" y="278" font-size="23" fill="#087f83" text-anchor="start">受理</text><rect x="665" y="316" width="268" height="116" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="799.0" y="350" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">電荷を確定反映</text><text x="799.0" y="382" font-size="20" fill="#64748b" text-anchor="middle">時刻・統計・履歴を更新</text>
<text x="799.0" y="410" font-size="20" fill="#64748b" text-anchor="middle">受理バッチ数 +1</text><path d="M665 199 L630 199 L630 369 L286 369" fill="none" stroke="#c44343" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#c44343)"/><text x="440" y="348" font-size="23" fill="#c44343" text-anchor="middle">棄却：h を半分に</text><rect x="28" y="316" width="255" height="116" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="155.5" y="350" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">開始状態へ戻す</text><text x="155.5" y="382" font-size="20" fill="#64748b" text-anchor="middle">候補電荷は反映しない</text>
<text x="155.5" y="410" font-size="20" fill="#64748b" text-anchor="middle">端数などを復元</text><path d="M156 315 L156 233" fill="none" stroke="#c44343" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#c44343)"/><text x="480" y="480" font-size="21" fill="#64748b" text-anchor="middle">制御するのは k ≠ 0 の電位変化。全体の精度は別に比較する。</text>
</g>
</svg>
