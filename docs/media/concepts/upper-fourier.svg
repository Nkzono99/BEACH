<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="title desc">
<title id="title">上部真空では非零成分の評価方法を切り替える</title>
<desc id="desc">全三角形より上に切替面を置き、その上の非零成分をFourier和、下をFMMとcached補正で評価し、面平均を共通に加える図。</desc>
<defs><marker id="64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="2563b0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563b0"/></marker><marker id="c44343" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c44343"/></marker><marker id="087f83" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087f83"/></marker><marker id="a66a08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a66a08"/></marker><marker id="203047" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#203047"/></marker></defs>
<g font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans CJK JP', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif">
<rect x="1" y="1" width="958" height="578" rx="20" fill="#ffffff" stroke="#dbe3eb" stroke-width="2"/>
<text x="28" y="43" font-size="28" fill="#203047" text-anchor="start" font-weight="700">上部真空では非零成分の評価方法を切り替える</text>
<text x="932" y="72" font-size="17" fill="#64748b" text-anchor="end">模式図・縮尺なし</text>
<rect x="150" y="135" width="420" height="130" rx="0" fill="#e3f0f9" stroke="#2563b0" stroke-width="2"/><rect x="150" y="265" width="420" height="155" rx="0" fill="#e4f2f2" stroke="#087f83" stroke-width="2"/><path d="M150 135 L570 135" fill="none" stroke="#203047" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="165" y="118" font-size="22" fill="#203047" text-anchor="start">H：box 上端</text><path d="M150 265 L570 265" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/><text x="604" y="272" font-size="24" fill="#203047" text-anchor="start">z_switch</text><text x="360" y="184" font-size="22" fill="#2563b0" text-anchor="middle">上部真空：panel Fourier 和</text>
<text x="360" y="218" font-size="22" fill="#2563b0" text-anchor="middle">k ≠ 0 の評価を切替</text><text x="360" y="310" font-size="22" fill="#087f83" text-anchor="middle">FMM + cached 補正</text>
<text x="360" y="341" font-size="22" fill="#087f83" text-anchor="middle">（非零成分）</text><polygon points="190,400 230,366 520,366 480,400" fill="#d9eeee" stroke="#087f83" stroke-width="2"/><path d="M230 366 L480 400 M355.0 366 L315.0 400" fill="none" stroke="#087f83" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="604" y="385" font-size="20" fill="#203047" text-anchor="start">全三角形は切替面より下</text><path d="M100 420 L100 135" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#64748b)"/><text x="90" y="116" font-size="24" fill="#203047" text-anchor="start">z</text><rect x="151" y="460" width="736" height="88" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="519.0" y="494" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">共通で加える成分</text><text x="519.0" y="526" font-size="20" fill="#64748b" text-anchor="middle">面平均 k = 0 と一様外部場</text><path d="M570 195 L914 195 L914 505 L892 505" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#64748b)"/><path d="M570 332 L914 332" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>
