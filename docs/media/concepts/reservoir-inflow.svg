<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 515" width="960" height="515" role="img" aria-labelledby="title desc">
<title id="title">上端面から入るプラズマの向きと量</title>
<desc id="desc">上端z-highの面全体から内向きの負z方向へ粒子が流入し、流束・面積・バッチ幅・重みで個数が決まる図。</desc>
<defs><marker id="64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="2563b0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563b0"/></marker><marker id="c44343" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c44343"/></marker><marker id="087f83" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087f83"/></marker><marker id="a66a08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a66a08"/></marker><marker id="203047" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#203047"/></marker></defs>
<g font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans CJK JP', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif">
<rect x="1" y="1" width="958" height="513" rx="20" fill="#ffffff" stroke="#dbe3eb" stroke-width="2"/>
<text x="28" y="43" font-size="28" fill="#203047" text-anchor="start" font-weight="700">上端面から入るプラズマの向きと量</text>
<text x="932" y="72" font-size="17" fill="#64748b" text-anchor="end">模式図・縮尺なし</text>
<rect x="75" y="210" width="470" height="225" rx="0" fill="#f1f8f8" stroke="#087f83" stroke-width="2"/><path d="M75 210 L545 210" fill="none" stroke="#087f83" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="83" y="141" font-size="24" fill="#203047" text-anchor="start">外部プラズマの分布</text><text x="83" y="194" font-size="22" fill="#087f83" text-anchor="start">z_high</text><circle cx="200" cy="169" r="12" fill="#2563b0"/><text x="200" y="175" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">−</text><path d="M200 186 L200 279" fill="none" stroke="#2563b0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#2563b0)"/><circle cx="310" cy="169" r="12" fill="#2563b0"/><text x="310" y="175" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">−</text><path d="M310 186 L310 279" fill="none" stroke="#2563b0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#2563b0)"/><circle cx="420" cy="169" r="12" fill="#2563b0"/><text x="420" y="175" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">−</text><path d="M420 186 L420 279" fill="none" stroke="#2563b0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#2563b0)"/><circle cx="510" cy="169" r="12" fill="#2563b0"/><text x="510" y="175" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">−</text><path d="M510 186 L510 279" fill="none" stroke="#2563b0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#2563b0)"/><text x="280" y="326" font-size="24" fill="#203047" text-anchor="middle">内向き法線 nᵢₙ = −ẑ</text><text x="280" y="373" font-size="21" fill="#203047" text-anchor="middle">法線速度を束で重み付け</text><text x="280" y="411" font-size="21" fill="#087f83" text-anchor="middle">選択した面全体から流入</text><path d="M42 300 L42 183" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#64748b)"/><text x="34" y="163" font-size="24" fill="#203047" text-anchor="start">z</text><rect x="587" y="120" width="341" height="122" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="757.5" y="154" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">1 バッチの期待個数</text><text x="757.5" y="186" font-size="20" fill="#64748b" text-anchor="middle">N = Γᵢₙ A Δtᵦ / w</text>
<text x="757.5" y="214" font-size="20" fill="#64748b" text-anchor="middle">Γᵢₙ：内向き束　A：面積</text><text x="600" y="286" font-size="20" fill="#203047" text-anchor="start">流入面は非周期かつ open</text>
<text x="600" y="324" font-size="20" fill="#203047" text-anchor="start">複数の面を選択できる</text>
<text x="600" y="362" font-size="20" fill="#203047" text-anchor="start">端数は次のバッチへ持ち越す</text>
<text x="600" y="400" font-size="20" fill="#203047" text-anchor="start">外向き粒子の処理は別に設定</text><text x="76" y="478" font-size="22" fill="#64748b" text-anchor="start">図は z_high の例。負の z 方向の drift は内向き。</text>
</g>
</svg>
