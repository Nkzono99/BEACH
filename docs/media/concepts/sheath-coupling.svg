<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" width="960" height="610" role="img" aria-labelledby="title desc">
<title id="title">外部シースの定常解をセル上端へ接続する</title>
<desc id="desc">外部の平面定常シースが電流、電位基準、流入分布、障壁、任意の法線電場をBEACHの上端へ渡し、セル内部で軌道を追跡する領域分担図。</desc>
<defs><marker id="64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="2563b0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563b0"/></marker><marker id="c44343" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c44343"/></marker><marker id="087f83" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087f83"/></marker><marker id="a66a08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a66a08"/></marker><marker id="203047" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#203047"/></marker></defs>
<g font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans CJK JP', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif">
<rect x="1" y="1" width="958" height="608" rx="20" fill="#ffffff" stroke="#dbe3eb" stroke-width="2"/>
<text x="28" y="43" font-size="28" fill="#203047" text-anchor="start" font-weight="700">外部シースの定常解をセル上端へ接続する</text>
<text x="932" y="72" font-size="17" fill="#64748b" text-anchor="end">模式図・縮尺なし</text>
<rect x="35" y="105" width="407" height="192" rx="12" fill="#f3f6fa" stroke="#94a3b8" stroke-width="2"/><text x="238" y="145" font-size="24" fill="#203047" text-anchor="middle">外部：平面・定常シース</text>
<text x="238" y="190" font-size="24" fill="#203047" text-anchor="middle">零電流根を解く</text>
<text x="238" y="235" font-size="24" fill="#203047" text-anchor="middle">上流プラズマの電位 = 0 V</text><rect x="35" y="354" width="407" height="178" rx="12" fill="#e4f2f2" stroke="#087f83" stroke-width="2"/><text x="238" y="395" font-size="25" fill="#087f83" text-anchor="middle" font-weight="700">BEACH の周期セル</text><polygon points="78,496 118,449 399,449 359,496" fill="#d9eeee" stroke="#087f83" stroke-width="2"/><path d="M118 449 L359 496 M238.5 449 L198.5 496" fill="none" stroke="#087f83" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M35 354 L442 354" fill="none" stroke="#203047" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="52" y="337" font-size="23" fill="#203047" text-anchor="start">H：z-high 面</text><rect x="506" y="106" width="420" height="184" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="716.0" y="140" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">根が上端へ渡す条件</text><text x="716.0" y="172" font-size="20" fill="#64748b" text-anchor="middle">電流の目標・壁電位 φ₀</text>
<text x="716.0" y="200" font-size="20" fill="#64748b" text-anchor="middle">流入分布・流出の障壁</text>
<text x="716.0" y="228" font-size="20" fill="#64748b" text-anchor="middle">任意の法線電場 E_z(H⁺)</text><path d="M444 197 L502 197" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><path d="M715 292 L715 352 L446 352" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><text x="504" y="409" font-size="21" fill="#203047" text-anchor="start">セル内は表面電荷から場を計算</text>
<text x="504" y="446" font-size="21" fill="#203047" text-anchor="start">粒子軌道と命中位置を求める</text>
<text x="504" y="483" font-size="21" fill="#203047" text-anchor="start">外部の飛行軌道・時間は解かない</text><path d="M36 443 L17 443 L17 203 L31 203" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#64748b)" stroke-dasharray="7 7"/><text x="480" y="576" font-size="19" fill="#64748b" text-anchor="middle">外部根の更新を有効にした場合だけ、受理バッチの PE + SEE 流出を戻す（破線）。</text>
</g>
</svg>
