<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 565" width="960" height="565" role="img" aria-labelledby="title desc">
<title id="title">出力を「最終状態・履歴・再開状態」に分けて読む</title>
<desc id="desc">出力先の最終状態ファイル、任意の履歴、直下と二つのスロットに保存されるcheckpointの関係を示す図。</desc>
<defs><marker id="64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="2563b0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563b0"/></marker><marker id="c44343" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c44343"/></marker><marker id="087f83" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087f83"/></marker><marker id="a66a08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a66a08"/></marker><marker id="203047" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#203047"/></marker></defs>
<g font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans CJK JP', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif">
<rect x="1" y="1" width="958" height="563" rx="20" fill="#ffffff" stroke="#dbe3eb" stroke-width="2"/>
<text x="28" y="43" font-size="28" fill="#203047" text-anchor="start" font-weight="700">出力を「最終状態・履歴・再開状態」に分けて読む</text>
<text x="932" y="72" font-size="17" fill="#64748b" text-anchor="end">模式図・縮尺なし</text>
<rect x="26" y="110" width="270" height="88" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="161.0" y="144" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">output.dir</text><text x="161.0" y="176" font-size="20" fill="#64748b" text-anchor="middle">実行ごとの保存先</text><path d="M162 200 L162 415 M162 260 L337 260 M162 414 L337 414" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M296 154 L337 154" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#64748b)"/><rect x="341" y="101" width="585" height="104" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="633.5" y="135" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">最終状態と実行記録</text><text x="633.5" y="167" font-size="20" fill="#64748b" text-anchor="middle">summary.txt / charges.csv</text>
<text x="633.5" y="195" font-size="20" fill="#64748b" text-anchor="middle">mesh_triangles.csv / mesh_sources.csv</text><rect x="341" y="223" width="585" height="94" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="633.5" y="257" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">履歴（有効にした出力）</text><text x="633.5" y="289" font-size="20" fill="#64748b" text-anchor="middle">charge_history.csv / potential_history.csv など</text><rect x="341" y="335" width="585" height="146" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="633.5" y="369" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">再開状態</text><text x="633.5" y="401" font-size="20" fill="#64748b" text-anchor="middle">直下：最終 checkpoint</text>
<text x="633.5" y="429" font-size="20" fill="#64748b" text-anchor="middle">checkpoints/slot0/ と slot1/：定期保存</text>
<text x="633.5" y="457" font-size="20" fill="#64748b" text-anchor="middle">各候補の checkpoint_complete.txt で完全性を確認</text><text x="30" y="527" font-size="20" fill="#64748b" text-anchor="start">定期保存は 2 世代。checkpoint_latest.txt は案内であり、完全性の証拠ではない。</text>
</g>
</svg>
