" stroke="#aebfcb" stroke-width="2"/><polygon points="90,294 104,267 121,294" fill="#d0e6e7" stroke="#087f83" stroke-width="2"/><rect x="135" y="252" width="60" height="60" rx="0" fill="#e4f2f2" stroke="#aebfcb" stroke-width="2"/><polygon points="150,294 164,267 181,294" fill="#d0e6e7" stroke="#087f83" stroke-width="2"/><rect x="195" y="252" width="60" height="60" rx="0" fill="#e4f2f2" stroke="#aebfcb" stroke-width="2"/><polygon points="210,294 224,267 241,294" fill="#d0e6e7" stroke="#087f83" stroke-width="2"/><rect x="255" y="252" width="60" height="60" rx="0" fill="#e4f2f2" stroke="#aebfcb" stroke-width="2"/><polygon points="270,294 284,267 301,294" fill="#d0e6e7" stroke="#087f83" stroke-width="2"/><rect x="315" y="252" width="60" height="60" rx="0" fill="#f3f6fa" stroke="#aebfcb" stroke-width="2"/><polygon points="330,294 344,267 361,294" fill="#d0e6e7" stroke="#087f83" stroke-width="2"/><rect x="75" y="312" width="60" height="60" rx="0" fill="#f3f6fa" stroke="#aebfcb" stroke-width="2"/><polygon points="90,354 104,327 121,354" fill="#d0e6e7" stroke="#087f83" stroke-width="2"/><rect x="135" y="312" width="60" height="60" rx="0" fill="#e4f2f2" stroke="#aebfcb" stroke-width="2"/><polygon points="150,354 164,327 181,354" fill="#d0e6e7" stroke="#087f83" stroke-width="2"/><rect x="195" y="312" width="60" height="60" rx="0" fill="#e4f2f2" stroke="#aebfcb" stroke-width="2"/><polygon points="210,354 224,327 241,354" fill="#d0e6e7" stroke="#087f83" stroke-width="2"/><rect x="255" y="312" width="60" height="60" rx="0" fill="#e4f2f2" stroke="#aebfcb" stroke-width="2"/><polygon points="270,354 284,327 301,354" fill="#d0e6e7" stroke="#087f83" stroke-width="2"/><rect x="315" y="312" width="60" height="60" rx="0" fill="#f3f6fa" stroke="#aebfcb" stroke-width="2"/><polygon points="330,354 344,327 361,354" fill="#d0e6e7" stroke="#087f83" stroke-width="2"/><rect x="75" y="372" width="60" height="60" rx="0" fill="#f3f6fa" stroke="#aebfcb" stroke-width="2"/><polygon points="90,414 104,387 121,414" fill="#d0e6e7" stroke="#087f83" stroke-width="2"/><rect x="135" y="372" width="60" height="60" rx="0" fill="#f3f6fa" stroke="#aebfcb" stroke-width="2"/><polygon points="150,414 164,387 181,414" fill="#d0e6e7" stroke="#087f83" stroke-width="2"/><rect x="195" y="372" width="60" height="60" rx="0" fill="#f3f6fa" stroke="#aebfcb" stroke-width="2"/><polygon points="210,414 224,387 241,414" fill="#d0e6e7" stroke="#087f83" stroke-width="2"/><rect x="255" y="372" width="60" height="60" rx="0" fill="#f3f6fa" stroke="#aebfcb" stroke-width="2"/><polygon points="270,414 284,387 301,414" fill="#d0e6e7" stroke="#087f83" stroke-width="2"/><rect x="315" y="372" width="60" height="60" rx="0" fill="#f3f6fa" stroke="#aebfcb" stroke-width="2"/><polygon points="330,414 344,387 361,414" fill="#d0e6e7" stroke="#087f83" stroke-width="2"/><rect x="195" y="252" width="60" height="60" rx="0" fill="none" stroke="#203047" stroke-width="4"/><rect x="135" y="192" width="180" height="180" rx="0" fill="none" stroke="#087f83" stroke-width="4"/><text x="225" y="120" font-size="22" fill="#203047" text-anchor="middle">x/y の繰り返し（上面図）</text><path d="M75 465 L374 465" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#64748b)"/><text x="390" y="473" font-size="22" fill="#203047" text-anchor="start">x</text><path d="M43 432 L43 135" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#64748b)"/><text x="36" y="119" font-size="22" fill="#203047" text-anchor="start">y</text><text x="227" y="506" font-size="20" fill="#203047" text-anchor="middle">中央：元のセル　枠：N = 1</text><rect x="465" y="111" width="459" height="101" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="694.5" y="145" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">有限画像の和</text><text x="694.5" y="177" font-size="20" fill="#64748b" text-anchor="middle">N = 1 なら 3 × 3 セル</text>
<text x="694.5" y="205" font-size="20" fill="#64748b" text-anchor="middle">cached_kneq0 では面平均を分離</text><text x="695" y="244" font-size="27" fill="#087f83" text-anchor="middle">＋</text><rect x="465" y="260" width="459" height="82" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="694.5" y="294" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">外側の面内変動成分</text><text x="694.5" y="326" font-size="20" fill="#64748b" text-anchor="middle">有限画像の外の k ≠ 0 を補正</text><text x="695" y="376" font-size="27" fill="#087f83" text-anchor="middle">＋</text><rect x="465" y="394" width="459" height="100" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="694.5" y="428" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">物理的な面平均成分</text><text x="694.5" y="460" font-size="20" fill="#64748b" text-anchor="middle">高さごとの電荷と下側境界で決まる</text>
<text x="694.5" y="488" font-size="20" fill="#64748b" text-anchor="middle">k = 0 を一度だけ加える</text><text x="480" y="553" font-size="20" fill="#64748b" text-anchor="middle">z 方向は非周期。finite_images 単独は有限画像だけで、右の分離を行わない。</text>
</g>
