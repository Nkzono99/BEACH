<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 565" width="960" height="565" role="img" aria-labelledby="title desc">
<title id="title">光電子の放出・帰還と表面に残る電荷</title>
<desc id="desc">照射開口からの光線が最初に当たる面から電子が放出され、再吸収または上端へ進む軌道と反作用電荷の符号を示す図。</desc>
<defs><marker id="64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="2563b0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563b0"/></marker><marker id="c44343" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c44343"/></marker><marker id="087f83" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087f83"/></marker><marker id="a66a08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a66a08"/></marker><marker id="203047" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#203047"/></marker></defs>
<g font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans CJK JP', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif">
<rect x="1" y="1" width="958" height="563" rx="20" fill="#ffffff" stroke="#dbe3eb" stroke-width="2"/>
<text x="28" y="43" font-size="28" fill="#203047" text-anchor="start" font-weight="700">光電子の放出・帰還と表面に残る電荷</text>
<text x="932" y="72" font-size="17" fill="#64748b" text-anchor="end">模式図・縮尺なし</text>
<path d="M60 138 L900 138" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="115" font-size="22" fill="#203047" text-anchor="start">照射開口（box 面上）</text><polygon points="90,414 130,331 860,331 820,414" fill="#d9eeee" stroke="#087f83" stroke-width="2"/><path d="M130 331 L820 414 M475.0 331 L435.0 414" fill="none" stroke="#087f83" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M173 145 L257 329" fill="none" stroke="#a66a08" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a66a08)"/><path d="M478 145 L562 329" fill="none" stroke="#a66a08" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a66a08)"/><text x="340" y="226" font-size="22" fill="#a66a08" text-anchor="middle">光線：最初の命中で放出</text><path d="M262 325 C315 195 399 210 460 328" fill="none" stroke="#2563b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#2563b0)"/><circle cx="336" cy="237" r="12" fill="#2563b0"/><text x="336" y="243" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">−</text><path d="M566 325 C600 238 695 224 727 159" fill="none" stroke="#2563b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#2563b0)"/><circle cx="655" cy="237" r="12" fill="#2563b0"/><text x="655" y="243" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">−</text><text x="425" y="295" font-size="21" fill="#2563b0" text-anchor="start">再吸収</text><text x="728" y="200" font-size="21" fill="#2563b0" text-anchor="start">上端へ</text><circle cx="264" cy="367" r="12" fill="#c44343"/><text x="264" y="373" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">+</text><circle cx="567" cy="367" r="12" fill="#c44343"/><text x="567" y="373" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">+</text><circle cx="462" cy="367" r="12" fill="#2563b0"/><text x="462" y="373" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">−</text><text x="205" y="450" font-size="22" fill="#c44343" text-anchor="start">放出元：−q w（電子なら正）</text><text x="558" y="450" font-size="22" fill="#2563b0" text-anchor="start">吸収先：q w（電子なら負）</text><text x="480" y="493" font-size="20" fill="#64748b" text-anchor="middle">反作用電荷は deposit_opposite_charge_on_emit=true の場合。</text><text x="480" y="526" font-size="20" fill="#64748b" text-anchor="middle">帰還・脱出は粒子追跡と上端境界で決まり、電荷はバッチ末尾に反映。</text>
</g>
</svg>
