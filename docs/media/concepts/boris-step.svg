<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" width="960" height="610" role="img" aria-labelledby="title desc">
<title id="title">Boris 法で 1 step の候補軌道を作る</title>
<desc id="desc">同時刻の位置と速度から予測中点電場を評価し、半電場加速、磁場回転、半電場加速の後、台形則で候補位置を作る図。</desc>
<defs><marker id="64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="2563b0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563b0"/></marker><marker id="c44343" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c44343"/></marker><marker id="087f83" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087f83"/></marker><marker id="a66a08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a66a08"/></marker><marker id="203047" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#203047"/></marker></defs>
<g font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans CJK JP', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif">
<rect x="1" y="1" width="958" height="608" rx="20" fill="#ffffff" stroke="#dbe3eb" stroke-width="2"/>
<text x="28" y="43" font-size="28" fill="#203047" text-anchor="start" font-weight="700">Boris 法で 1 step の候補軌道を作る</text>
<text x="932" y="72" font-size="17" fill="#64748b" text-anchor="end">模式図・縮尺なし</text>
<rect x="27" y="110" width="267" height="94" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="160.5" y="144" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">入力：xⁿ, vⁿ</text><text x="160.5" y="176" font-size="20" fill="#64748b" text-anchor="middle">位置と速度は同じ時刻</text><rect x="353" y="110" width="579" height="94" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="642.5" y="144" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">予測中点の場を 1 回評価</text><text x="642.5" y="176" font-size="20" fill="#64748b" text-anchor="middle">x_mid = xⁿ + vⁿ Δt / 2</text><path d="M296 157 L349 157" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><rect x="27" y="262" width="267" height="99" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="160.5" y="296" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">電場で半分加速</text><text x="160.5" y="328" font-size="20" fill="#64748b" text-anchor="middle">vⁿ → v⁻</text><rect x="353" y="262" width="254" height="99" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="480.0" y="296" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">磁場で回転</text><text x="480.0" y="328" font-size="20" fill="#64748b" text-anchor="middle">v⁻ → v⁺</text><rect x="667" y="262" width="265" height="99" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="799.5" y="296" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">電場で半分加速</text><text x="799.5" y="328" font-size="20" fill="#64748b" text-anchor="middle">v⁺ → vⁿ⁺¹</text><path d="M645 206 L645 233 L161 233 L161 258" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><path d="M296 311 L348 311" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><path d="M609 311 L662 311" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><rect x="136" y="426" width="688" height="101" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="480.0" y="460" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">候補位置を台形則で更新</text><text x="480.0" y="492" font-size="20" fill="#64748b" text-anchor="middle">xⁿ⁺¹ = xⁿ + (vⁿ + vⁿ⁺¹) Δt / 2</text><path d="M802 364 L802 401 L480 401 L480 422" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><text x="480" y="572" font-size="21" fill="#64748b" text-anchor="middle">候補を作った後、軌道線分上の最初の衝突・box 境界を判定する。</text>
</g>
</svg>
