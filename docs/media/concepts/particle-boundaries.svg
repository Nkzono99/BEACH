<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 625" width="960" height="625" role="img" aria-labelledby="title desc">
<title id="title">box 面で粒子がどう進むか</title>
<desc id="desc">周期面では反対側へ移動、開放面では脱出、反射では法線速度を反転、再配置つき反射では面内位置も選び直す比較図。</desc>
<defs><marker id="64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="2563b0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563b0"/></marker><marker id="c44343" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c44343"/></marker><marker id="087f83" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087f83"/></marker><marker id="a66a08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a66a08"/></marker><marker id="203047" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#203047"/></marker></defs>
<g font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans CJK JP', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif">
<rect x="1" y="1" width="958" height="623" rx="20" fill="#ffffff" stroke="#dbe3eb" stroke-width="2"/>
<text x="28" y="43" font-size="28" fill="#203047" text-anchor="start" font-weight="700">box 面で粒子がどう進むか</text>
<text x="932" y="72" font-size="17" fill="#64748b" text-anchor="end">模式図・縮尺なし</text>
<rect x="25" y="97" width="440" height="215" rx="12" fill="#f3f6fa" stroke="#cbd5e1" stroke-width="2"/><text x="245" y="133" font-size="22" fill="#203047" text-anchor="middle" font-weight="700">周期</text><rect x="495" y="97" width="440" height="215" rx="12" fill="#f3f6fa" stroke="#cbd5e1" stroke-width="2"/><text x="715" y="133" font-size="22" fill="#203047" text-anchor="middle" font-weight="700">開放：open</text><rect x="25" y="333" width="440" height="215" rx="12" fill="#f3f6fa" stroke="#cbd5e1" stroke-width="2"/><text x="245" y="369" font-size="22" fill="#203047" text-anchor="middle" font-weight="700">反射：reflect</text><rect x="495" y="333" width="440" height="215" rx="12" fill="#f3f6fa" stroke="#cbd5e1" stroke-width="2"/><text x="715" y="369" font-size="22" fill="#203047" text-anchor="middle" font-weight="700">再配置：redistributed_reflect</text><rect x="78" y="160" width="334" height="82" rx="0" fill="#ffffff" stroke="#087f83" stroke-width="2"/><path d="M326 201 L435 201" fill="none" stroke="#2563b0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#2563b0)"/><path d="M53 201 L161 201" fill="none" stroke="#2563b0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#2563b0)"/><circle cx="314" cy="201" r="12" fill="#2563b0"/><text x="314" y="207" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">−</text><text x="245" y="282" font-size="21" fill="#203047" text-anchor="middle">反対側へ移す。速度は同じ。</text><path d="M533 221 L893 221" fill="none" stroke="#087f83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M637 251 L730 159" fill="none" stroke="#2563b0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#2563b0)"/><circle cx="649" cy="238" r="12" fill="#2563b0"/><text x="649" y="244" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">−</text><text x="806" y="189" font-size="21" fill="#2563b0" text-anchor="start">脱出</text><text x="715" y="282" font-size="20" fill="#203047" text-anchor="middle">外部障壁なしの開放面の例</text><path d="M65 429 L425 429" fill="none" stroke="#087f83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M100 485 L205 431" fill="none" stroke="#2563b0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#2563b0)"/><path d="M206 431 L311 485" fill="none" stroke="#2563b0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#2563b0)"/><text x="245" y="527" font-size="21" fill="#203047" text-anchor="middle">法線速度だけ反転</text><path d="M535 429 L895 429" fill="none" stroke="#087f83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M563 485 L642 431" fill="none" stroke="#2563b0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#2563b0)"/><path d="M783 431 L863 485" fill="none" stroke="#2563b0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#2563b0)"/><path d="M647 416 L777 416" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#64748b)" stroke-dasharray="7 7"/><text x="715" y="392" font-size="18" fill="#64748b" text-anchor="middle">面内の位置を選び直す</text><text x="715" y="527" font-size="21" fill="#203047" text-anchor="middle">速度の扱いは反射と同じ</text><text x="480" y="590" font-size="20" fill="#64748b" text-anchor="middle">周期軸は domain.periodic_axes。非周期面の作用は粒子種ごとに指定できる。</text>
</g>
</svg>
