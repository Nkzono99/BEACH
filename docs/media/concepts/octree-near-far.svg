<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" role="img" aria-labelledby="title desc">
<title id="title">Treecode：木を分け、遠い群をまとめる</title>
<desc id="desc">三軸二分の八分木と、遠方同符号群の単極近似、近傍または相殺する群を子へ分解するTreecodeの判断を示す図。</desc>
<defs><marker id="64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="2563b0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563b0"/></marker><marker id="c44343" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c44343"/></marker><marker id="087f83" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087f83"/></marker><marker id="a66a08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a66a08"/></marker><marker id="203047" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#203047"/></marker></defs>
<g font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans CJK JP', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif">
<rect x="1" y="1" width="958" height="528" rx="20" fill="#ffffff" stroke="#dbe3eb" stroke-width="2"/>
<text x="28" y="43" font-size="28" fill="#203047" text-anchor="start" font-weight="700">Treecode：木を分け、遠い群をまとめる</text>
<text x="932" y="72" font-size="17" fill="#64748b" text-anchor="end">模式図・縮尺なし</text>
<rect x="56" y="162" width="164" height="164" rx="0" fill="#e4f2f2" stroke="#087f83" stroke-width="2"/><polygon points="56,162 122,109 286,109 220,162" fill="#d9eeee" stroke="#087f83" stroke-width="2"/><polygon points="220,162 286,109 286,273 220,326" fill="#d9eeee" stroke="#087f83" stroke-width="2"/><path d="M138 162 L138 326 M56 244 L220 244 M89 135 L253 135 M138 162 L204 109 M220 244 L286 191 M253 135 L253 299" fill="none" stroke="#087f83" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="171" y="379" font-size="20" fill="#203047" text-anchor="middle">3 軸を二分して 8 分割</text>
<text x="171" y="411" font-size="20" fill="#203047" text-anchor="middle">三角形重心で所属を決める</text>
<text x="171" y="443" font-size="20" fill="#203047" text-anchor="middle">近さの判定は全頂点を覆う</text><rect x="370" y="107" width="558" height="84" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="649.0" y="141" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">遠方かつ同符号の群</text><text x="649.0" y="173" font-size="20" fill="#64748b" text-anchor="middle">総電荷と電荷中心の単極近似</text><rect x="370" y="224" width="558" height="84" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="649.0" y="258" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">近傍、または正負が相殺する群</text><text x="649.0" y="290" font-size="20" fill="#64748b" text-anchor="middle">子へ降りる。葉では三角形の直接和</text><rect x="370" y="343" width="558" height="98" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="649.0" y="377" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">評価点ごとに木をたどる</text><text x="649.0" y="409" font-size="20" fill="#64748b" text-anchor="middle">FMM のような評価側の局所展開は作らない</text><path d="M288 195 L326 195 L326 150 L366 150" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><path d="M326 195 L326 267 L366 267" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><path d="M930 150 L945 150 L945 390 L931 390" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#64748b)"/><path d="M930 267 L945 267" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="480" y="492" font-size="22" fill="#64748b" text-anchor="middle">木の形は固定し、バッチごとに群の電荷情報を更新する。</text>
</g>
</svg>
