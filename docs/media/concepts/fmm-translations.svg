<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="960" height="490" role="img" aria-labelledby="title desc">
<title id="title">FMM：遠方の展開と近傍の直接和</title>
<desc id="desc">三角形から多重極を作って親へ集約し、離れた評価側の局所展開へ変換して配り、近傍直接和を加える図。</desc>
<defs><marker id="64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="2563b0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563b0"/></marker><marker id="c44343" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c44343"/></marker><marker id="087f83" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087f83"/></marker><marker id="a66a08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a66a08"/></marker><marker id="203047" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#203047"/></marker></defs>
<g font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans CJK JP', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif">
<rect x="1" y="1" width="958" height="488" rx="20" fill="#ffffff" stroke="#dbe3eb" stroke-width="2"/>
<text x="28" y="43" font-size="28" fill="#203047" text-anchor="start" font-weight="700">FMM：遠方の展開と近傍の直接和</text>
<text x="932" y="72" font-size="17" fill="#64748b" text-anchor="end">模式図・縮尺なし</text>
<rect x="30" y="115" width="260" height="108" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="160.0" y="149" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">線源の三角形</text><text x="160.0" y="181" font-size="20" fill="#64748b" text-anchor="middle">電荷から多重極を作る</text>
<text x="160.0" y="209" font-size="20" fill="#64748b" text-anchor="middle">P2M</text><rect x="350" y="115" width="260" height="108" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="480.0" y="149" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">線源側の木</text><text x="480.0" y="181" font-size="20" fill="#64748b" text-anchor="middle">子 → 親へまとめる</text>
<text x="480.0" y="209" font-size="20" fill="#64748b" text-anchor="middle">M2M</text><rect x="670" y="115" width="260" height="108" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="800.0" y="149" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">評価側の局所展開</text><text x="800.0" y="181" font-size="20" fill="#64748b" text-anchor="middle">離れた群から変換</text>
<text x="800.0" y="209" font-size="20" fill="#64748b" text-anchor="middle">M2L</text><path d="M290 169 L347 169" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><path d="M610 169 L667 169" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><rect x="670" y="280" width="260" height="108" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="800.0" y="314" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">評価点の場</text><text x="800.0" y="346" font-size="20" fill="#64748b" text-anchor="middle">親 → 子へ配る L2L</text>
<text x="800.0" y="374" font-size="20" fill="#64748b" text-anchor="middle">局所展開を評価 L2P</text><path d="M800 224 L800 277" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><rect x="30" y="280" width="500" height="108" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="280.0" y="314" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">近傍の三角形は直接評価</text><text x="280.0" y="346" font-size="20" fill="#64748b" text-anchor="middle">遠方展開と重複させずに加える</text><path d="M160 223 L160 277" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#64748b)"/><path d="M532 335 L666 335" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#64748b)"/><text x="597" y="319" font-size="20" fill="#64748b" text-anchor="middle">加算</text><text x="480" y="454" font-size="22" fill="#64748b" text-anchor="middle">形状の木を再利用し、表面電荷が変わると展開係数を更新する。</text>
</g>
</svg>
