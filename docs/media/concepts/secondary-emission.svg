<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" width="960" height="590" role="img" aria-labelledby="title desc">
<title id="title">入射吸収と二次電子放出を別々に数える</title>
<desc id="desc">入射電子の吸収で負電荷が加わり、二次電子の放出ごとに正の反作用電荷が加わる図。</desc>
<defs><marker id="64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="2563b0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563b0"/></marker><marker id="c44343" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c44343"/></marker><marker id="087f83" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087f83"/></marker><marker id="a66a08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a66a08"/></marker><marker id="203047" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#203047"/></marker></defs>
<g font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans CJK JP', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif">
<rect x="1" y="1" width="958" height="588" rx="20" fill="#ffffff" stroke="#dbe3eb" stroke-width="2"/>
<text x="28" y="43" font-size="28" fill="#203047" text-anchor="start" font-weight="700">入射吸収と二次電子放出を別々に数える</text>
<text x="932" y="72" font-size="17" fill="#64748b" text-anchor="end">模式図・縮尺なし</text>
<polygon points="62,427 102,337 882,337 842,427" fill="#d9eeee" stroke="#087f83" stroke-width="2"/><path d="M102 337 L842 427 M472.0 337 L432.0 427" fill="none" stroke="#087f83" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M206 151 L347 335" fill="none" stroke="#2563b0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#2563b0)"/><circle cx="206" cy="151" r="12" fill="#2563b0"/><text x="206" y="157" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">−</text><text x="56" y="117" font-size="23" fill="#203047" text-anchor="start">入射電子の例：電荷 qᵢₙ、重み w</text><path d="M357 328 L471 187" fill="none" stroke="#2563b0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#2563b0)"/><circle cx="452" cy="210" r="12" fill="#2563b0"/><text x="452" y="216" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">−</text><path d="M365 330 L608 245" fill="none" stroke="#2563b0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#2563b0)"/><circle cx="565" cy="260" r="12" fill="#2563b0"/><text x="565" y="266" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">−</text><text x="599" y="142" font-size="22" fill="#203047" text-anchor="start">収率と乱数から放出数を決める</text>
<text x="599" y="174" font-size="22" fill="#203047" text-anchor="start">各二次電子は重み w を継承</text><circle cx="330" cy="381" r="12" fill="#2563b0"/><text x="330" y="387" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">−</text><circle cx="386" cy="381" r="12" fill="#c44343"/><text x="386" y="387" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">+</text><circle cx="435" cy="381" r="12" fill="#c44343"/><text x="435" y="387" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">+</text><text x="53" y="470" font-size="23" fill="#2563b0" text-anchor="start">入射吸収：qᵢₙ w</text><text x="413" y="470" font-size="23" fill="#c44343" text-anchor="start">二次電子 1 個の反作用：−qₛₑₑ w</text><text x="480" y="518" font-size="21" fill="#64748b" text-anchor="middle">放出後も同じバッチの固定した場で追跡する。</text>
<text x="480" y="548" font-size="21" fill="#64748b" text-anchor="middle">図の 2 個は一例。世代上限で抑えた放出の反作用電荷は置かない。</text>
</g>
</svg>
