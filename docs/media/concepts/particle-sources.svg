<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 515" width="960" height="515" role="img" aria-labelledby="title desc">
<title id="title">粒子を作る場所から供給方法を選ぶ</title>
<desc id="desc">指定領域の体積生成、非周期面全体からの境界流入、光線の命中面からの光電子放出を比較する図。</desc>
<defs><marker id="64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="2563b0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563b0"/></marker><marker id="c44343" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c44343"/></marker><marker id="087f83" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087f83"/></marker><marker id="a66a08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a66a08"/></marker><marker id="203047" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#203047"/></marker></defs>
<g font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans CJK JP', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif">
<rect x="1" y="1" width="958" height="513" rx="20" fill="#ffffff" stroke="#dbe3eb" stroke-width="2"/>
<text x="28" y="43" font-size="28" fill="#203047" text-anchor="start" font-weight="700">粒子を作る場所から供給方法を選ぶ</text>
<text x="932" y="72" font-size="17" fill="#64748b" text-anchor="end">模式図・縮尺なし</text>
<rect x="24" y="96" width="280" height="340" rx="12" fill="#f3f6fa" stroke="#cbd5e1" stroke-width="2"/><text x="164" y="134" font-size="24" fill="#203047" text-anchor="middle" font-weight="700">volume_seed</text><rect x="52" y="180" width="224" height="150" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><rect x="340" y="96" width="280" height="340" rx="12" fill="#f3f6fa" stroke="#cbd5e1" stroke-width="2"/><text x="480" y="134" font-size="24" fill="#203047" text-anchor="middle" font-weight="700">inflow</text><rect x="368" y="180" width="224" height="150" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><rect x="656" y="96" width="280" height="340" rx="12" fill="#f3f6fa" stroke="#cbd5e1" stroke-width="2"/><text x="796" y="134" font-size="24" fill="#203047" text-anchor="middle" font-weight="700">photo_raycast</text><rect x="684" y="180" width="224" height="150" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><circle cx="85" cy="224" r="12" fill="#2563b0"/><text x="85" y="230" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">−</text><circle cx="145" cy="261" r="12" fill="#2563b0"/><text x="145" y="267" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">−</text><circle cx="219" cy="213" r="12" fill="#2563b0"/><text x="219" y="219" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">−</text><circle cx="236" cy="289" r="12" fill="#2563b0"/><text x="236" y="295" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">−</text><circle cx="103" cy="298" r="12" fill="#2563b0"/><text x="103" y="304" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">−</text><rect x="68" y="204" width="188" height="108" rx="0" fill="none" stroke="#087f83" stroke-width="2"/><text x="164" y="363" font-size="20" fill="#203047" text-anchor="middle">指定領域に個数を置く</text><text x="164" y="398" font-size="19" fill="#64748b" text-anchor="middle">面流束からは決めない</text><circle cx="396" cy="164" r="12" fill="#2563b0"/><text x="396" y="170" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">−</text><path d="M396 182 L396 246" fill="none" stroke="#2563b0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#2563b0)"/><circle cx="471" cy="164" r="12" fill="#2563b0"/><text x="471" y="170" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">−</text><path d="M471 182 L471 246" fill="none" stroke="#2563b0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#2563b0)"/><circle cx="546" cy="164" r="12" fill="#2563b0"/><text x="546" y="170" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">−</text><path d="M546 182 L546 246" fill="none" stroke="#2563b0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#2563b0)"/><text x="480" y="288" font-size="19" fill="#64748b" text-anchor="middle">選択した非周期面</text><text x="480" y="363" font-size="20" fill="#203047" text-anchor="middle">面全体から流入</text><text x="480" y="398" font-size="19" fill="#64748b" text-anchor="middle">流束 × 面積 × バッチ幅</text><polygon points="695,316 735,276 897,276 857,316" fill="#d9eeee" stroke="#087f83" stroke-width="2"/><path d="M735 276 L857 316 M796.0 276 L756.0 316" fill="none" stroke="#087f83" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M740 157 L768 273" fill="none" stroke="#a66a08" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a66a08)"/><path d="M778 273 L842 211" fill="none" stroke="#2563b0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#2563b0)"/><circle cx="830" cy="225" r="12" fill="#2563b0"/><text x="830" y="231" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">−</text><text x="796" y="363" font-size="20" fill="#203047" text-anchor="middle">光線が当たる表面で生成</text><text x="796" y="398" font-size="18" fill="#64748b" text-anchor="middle">命中しない光線は放出なし</text><text x="480" y="478" font-size="23" fill="#087f83" text-anchor="middle">生成した後は、どの粒子も同じ固定した場で追跡する。</text>
