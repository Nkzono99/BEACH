<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="960" height="490" role="img" aria-labelledby="title desc">
<title id="title">1 バッチの 6 段階</title>
<desc id="desc">開始時電荷から場を構成し、粒子生成、固定場の追跡、イベント処理、電荷差分集約、確定反映を循環する6段階の図。</desc>
<defs><marker id="64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="2563b0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563b0"/></marker><marker id="c44343" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c44343"/></marker><marker id="087f83" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087f83"/></marker><marker id="a66a08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a66a08"/></marker><marker id="203047" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#203047"/></marker></defs>
<g font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans CJK JP', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif">
<rect x="1" y="1" width="958" height="488" rx="20" fill="#ffffff" stroke="#dbe3eb" stroke-width="2"/>
<text x="28" y="43" font-size="28" fill="#203047" text-anchor="start" font-weight="700">1 バッチの 6 段階</text>
<text x="932" y="72" font-size="17" fill="#64748b" text-anchor="end">模式図・縮尺なし</text>
<rect x="30" y="110" width="260" height="106" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="160.0" y="144" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">1. 場を構成</text><text x="160.0" y="176" font-size="20" fill="#64748b" text-anchor="middle">開始時の表面電荷を使う</text><rect x="350" y="110" width="260" height="106" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="480.0" y="144" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">2. 粒子を生成</text><text x="480.0" y="176" font-size="20" fill="#64748b" text-anchor="middle">設定した供給方法から</text><rect x="670" y="110" width="260" height="106" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="800.0" y="144" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">3. 軌道を追跡</text><text x="800.0" y="176" font-size="20" fill="#64748b" text-anchor="middle">場を固定して前進</text><rect x="670" y="292" width="260" height="106" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="800.0" y="326" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">4. イベントを処理</text><text x="800.0" y="358" font-size="20" fill="#64748b" text-anchor="middle">吸収・脱出・放出</text><rect x="350" y="292" width="260" height="106" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="480.0" y="326" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">5. 電荷差分を集約</text><text x="480.0" y="358" font-size="20" fill="#64748b" text-anchor="middle">まだ表面電荷は変えない</text><rect x="30" y="292" width="260" height="106" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="160.0" y="326" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">6. 電荷を確定反映</text><text x="160.0" y="358" font-size="20" fill="#64748b" text-anchor="middle">表面モデル・統計を更新</text><path d="M291 163 L347 163" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><path d="M611 163 L667 163" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><path d="M800 217 L800 289" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><path d="M668 345 L614 345" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><path d="M348 345 L294 345" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><path d="M160 290 L160 220" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><text x="480" y="254" font-size="23" fill="#087f83" text-anchor="middle">2〜5 の間は同じ場を使う</text><text x="480" y="449" font-size="22" fill="#64748b" text-anchor="middle">一周が 1 バッチ。新しい電荷が効くのは次の「1」から。</text>
</g>
</svg>
