<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 555" width="960" height="555" role="img" aria-labelledby="title desc">
<title id="title">上流近傍の「負の E²」の帯を読む</title>
<desc id="desc">電位を横軸とするE²の模式曲線が上流電位0Vの手前φbで負に入り、0Vでゼロに戻る帯と場の不足を示す図。</desc>
<defs><marker id="64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="2563b0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563b0"/></marker><marker id="c44343" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c44343"/></marker><marker id="087f83" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087f83"/></marker><marker id="a66a08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a66a08"/></marker><marker id="203047" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#203047"/></marker></defs>
<g font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans CJK JP', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif">
<rect x="1" y="1" width="958" height="553" rx="20" fill="#ffffff" stroke="#dbe3eb" stroke-width="2"/>
<text x="28" y="43" font-size="28" fill="#203047" text-anchor="start" font-weight="700">上流近傍の「負の E²」の帯を読む</text>
<text x="932" y="72" font-size="17" fill="#64748b" text-anchor="end">模式図・縮尺なし</text>
<rect x="492" y="139" width="327" height="246" rx="0" fill="#fff3e2" stroke="none" stroke-width="2"/><path d="M88 386 L88 111" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#64748b)"/><path d="M75 270 L880 270" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#64748b)"/><text x="102" y="119" font-size="23" fill="#203047" text-anchor="start">E²(φ)  [(V/m)²]</text><text x="882" y="304" font-size="22" fill="#203047" text-anchor="start">φ [V]</text><path d="M114 144 C270 164 414 199 492 270 C597 372 740 372 819 270" fill="none" stroke="#087f83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="488" y="299" font-size="22" fill="#203047" text-anchor="end">φ_b</text><text x="830" y="299" font-size="22" fill="#203047" text-anchor="start">0</text><text x="76" y="278" font-size="20" fill="#203047" text-anchor="end">0</text><text x="653" y="180" font-size="24" fill="#a66a08" text-anchor="middle">上流に接する帯</text><text x="653" y="221" font-size="24" fill="#a66a08" text-anchor="middle">E² &lt; 0</text><text x="268" y="332" font-size="22" fill="#087f83" text-anchor="middle">壁側：実数の場を構成</text><text x="480" y="435" font-size="21" fill="#203047" text-anchor="middle">帯の中では実数の z(φ) を構成できない。</text>
<text x="480" y="473" font-size="21" fill="#203047" text-anchor="middle">場の不足 √(−min E²) と指定した場の下限を比較して受理を判断する。</text>
<text x="480" y="511" font-size="21" fill="#203047" text-anchor="middle">曲線は関係を示す模式図で、数値解や実測値ではない。</text>
</g>
</svg>
