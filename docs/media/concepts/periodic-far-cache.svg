<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="title desc">
<title id="title">遠方補正は事前に作り、電荷更新ごとに使う</title>
<desc id="desc">box固定格子の遠方演算子を起動時に生成または再利用し、電荷更新ごとに多重極へ適用、粒子評価は局所展開と近傍和を使う図。</desc>
<defs><marker id="64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="2563b0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563b0"/></marker><marker id="c44343" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c44343"/></marker><marker id="087f83" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087f83"/></marker><marker id="a66a08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a66a08"/></marker><marker id="203047" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#203047"/></marker></defs>
<g font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans CJK JP', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif">
<rect x="1" y="1" width="958" height="578" rx="20" fill="#ffffff" stroke="#dbe3eb" stroke-width="2"/>
<text x="28" y="43" font-size="28" fill="#203047" text-anchor="start" font-weight="700">遠方補正は事前に作り、電荷更新ごとに使う</text>
<text x="932" y="72" font-size="17" fill="#64748b" text-anchor="end">模式図・縮尺なし</text>
<text x="36" y="115" font-size="23" fill="#203047" text-anchor="start" font-weight="700">起動時：box と設定が一致すれば保存済み演算子を再利用</text><rect x="26" y="143" width="274" height="116" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="163.0" y="177" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">線源セル・評価格子</text><text x="163.0" y="209" font-size="20" fill="#64748b" text-anchor="middle">box 寸法と分割</text>
<text x="163.0" y="237" font-size="20" fill="#64748b" text-anchor="middle">有限画像の層数など</text><rect x="343" y="143" width="274" height="116" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="480.0" y="177" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">遠方演算子を生成</text><text x="480.0" y="209" font-size="20" fill="#64748b" text-anchor="middle">Ewald 参照・面平均の分離</text>
<text x="480.0" y="237" font-size="20" fill="#64748b" text-anchor="middle">保存・検査</text><rect x="660" y="143" width="274" height="116" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="797.0" y="177" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">遠方演算子 Aₜ,ₛ</text><text x="797.0" y="209" font-size="20" fill="#64748b" text-anchor="middle">粒子位置には依存しない</text><path d="M302 200 L339 200" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><path d="M619 200 L656 200" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><text x="36" y="319" font-size="23" fill="#203047" text-anchor="start" font-weight="700">電荷更新時：現在の電荷に演算子を適用</text><rect x="26" y="349" width="274" height="111" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="163.0" y="383" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">セルの多重極 Mₛ</text><text x="163.0" y="415" font-size="20" fill="#64748b" text-anchor="middle">三角形の電荷から集約</text><rect x="343" y="349" width="274" height="111" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="480.0" y="383" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">局所展開へ加算</text><text x="480.0" y="415" font-size="20" fill="#64748b" text-anchor="middle">Lₜᶠᵃʳ = Σₛ Aₜ,ₛ Mₛ</text><rect x="660" y="349" width="274" height="111" rx="12" fill="#f3f6fa" stroke="#087f83" stroke-width="2"/><text x="797.0" y="383" font-size="23" fill="#203047" text-anchor="middle" font-weight="700">粒子位置で評価</text><text x="797.0" y="415" font-size="20" fill="#64748b" text-anchor="middle">局所展開 + 近傍直接和</text><path d="M302 404 L339 404" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><path d="M619 404 L656 404" fill="none" stroke="#087f83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#087f83)"/><path d="M799 261 L799 286 L478 286 L478 346" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#64748b)"/><text x="480" y="507" font-size="22" fill="#64748b" text-anchor="middle">粒子を 1 step 進めるたびに Ewald 和を計算するわけではない。</text><text x="480" y="542" font-size="20" fill="#64748b" text-anchor="middle">図は遠方補正の経路。物理的な面平均成分は別に一度だけ加える。</text>
</g>
</svg>
