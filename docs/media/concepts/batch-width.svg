<text x="28" y="43" font-size="28" fill="#203047" text-anchor="start" font-weight="700">バッチ幅は場を更新する間隔</text>
<text x="932" y="72" font-size="17" fill="#64748b" text-anchor="end">模式図・縮尺なし</text>
