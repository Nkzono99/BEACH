name: Physics Contracts

on:
  pull_request:
    paths:
      - "src/**"
      - "app/**"
      - "tests/**"
      - "schemas/**"
      - "examples/**"
      - "MANIFEST.in"
      - "fpm.toml"
      - "pyproject.toml"
      - "Makefile"
      - "tools/verify_sdist.py"
      - ".github/workflows/publish-pypi.yml"
      - ".github/workflows/physics-contracts.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: physics-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-sdist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          python -m pip install --upgrade pip build

      - name: Validate source distribution installation
        run: |
          python -m build --sdist
          python tools/verify_sdist.py dist/*.tar.gz
          python -m pip wheel --no-deps dist/*.tar.gz --wheel-dir build/wheelhouse

      - name: Smoke-test installed wheel
        run: |
          smoke_dir="$RUNNER_TEMP/beach-wheel-smoke"
          python -m venv "$smoke_dir"
          "$smoke_dir/bin/python" -m pip install "$GITHUB_WORKSPACE"/build/wheelhouse/*.whl
          cd "$RUNNER_TEMP"
          "$smoke_dir/bin/beach" --version
          "$smoke_dir/bin/beach-zhao-response" --help
          "$smoke_dir/bin/beachx" --help

  portable-l2:
    runs-on: ubuntu-latest
    env:
      MPI_FC: mpifort
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup fpm
        uses: fortran-lang/setup-fpm@v10

      - name: Install compiler and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libopenmpi-dev openmpi-bin
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e . --no-build-isolation
          python -m pip install pytest

      - name: Run portable physics contracts
        run: make test-l2
