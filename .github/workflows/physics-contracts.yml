name: Physics Contracts

on:
  pull_request:
    paths:
      - "src/**"
      - "app/**"
      - "tests/**"
      - "schemas/**"
      - "examples/**"
      - "fpm.toml"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/physics-contracts.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: physics-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-l2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup fpm
        uses: fortran-lang/setup-fpm@v10

      - name: Install compiler and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e . --no-build-isolation
          python -m pip install pytest

      - name: Run portable physics contracts
        run: make test-l2
