name: Publish to PyPI (sdist only)

on:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist
          python tools/verify_sdist.py dist/*.tar.gz
          sudo apt-get update
          sudo apt-get install -y gfortran
          python -m pip wheel --no-deps dist/*.tar.gz --wheel-dir build/wheelhouse
          ls -lh dist

      - name: Smoke-test installed wheel
        run: |
          smoke_dir="$RUNNER_TEMP/beach-wheel-smoke"
          python -m venv "$smoke_dir"
          "$smoke_dir/bin/python" -m pip install "$GITHUB_WORKSPACE"/build/wheelhouse/*.whl
          cd "$RUNNER_TEMP"
          "$smoke_dir/bin/beach" --version
          "$smoke_dir/bin/beach-zhao-response" --help
          "$smoke_dir/bin/beachx" --help

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build-sdist
    if: github.event_name == 'release'
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/beach-bem
    steps:
      - name: Download sdist artifact
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
