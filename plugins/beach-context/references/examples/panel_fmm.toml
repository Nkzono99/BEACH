#:schema https://raw.githubusercontent.com/Nkzono99/BEACH/main/schemas/beach.schema.json
# Generated by beachx config init

[run]
batch_count = 1

[domain]
box_min = [
    -0.6,
    -0.6,
    -0.1,
]
box_max = [
    0.6,
    0.6,
    0.4,
]
periodic_axes = []

[[mesh.parts]]
enabled = true
kind = "plane"
surface_model = "insulator"
surface_side = "normal_plus"
center = [
    0.0,
    0.0,
    0.0,
]
size_x = 1.0
size_y = 1.0
nx = 8
ny = 8

[particles.tracking]
dt_s = 1e-10
max_steps_per_particle = 20

[particles.boundary]
x_low = "open"
x_high = "open"
y_low = "open"
y_high = "open"
z_low = "open"
z_high = "open"

[[particles.species]]
enabled = true
charge_c = -1.602176634e-19
mass_kg = 9.10938356e-31

[particles.species.source]
mode = "volume_seed"
pos_low = [
    -0.2,
    -0.2,
    0.1,
]
pos_high = [
    0.2,
    0.2,
    0.2,
]

[particles.species.sampling]
volume_macro_particles_per_batch = 4

[particles.species.distribution]
drift_velocity_m_s = [
    0.0,
    0.0,
    -100000.0,
]
temperature_k = 0.0

[fields]
boundary = "free"

[fields.solver]
method = "fmm"

[fields.solver.tree]
theta = 0.45
leaf_max = 8

[output]
enabled = false
