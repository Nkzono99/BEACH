#:schema https://raw.githubusercontent.com/Nkzono99/BEACH/main/schemas/beach.schema.json
# Generated by beachx config init

[run]
batch_count = 1
rng_seed = 12345

[domain]
box_min = [
    0.0,
    0.0,
    0.0,
]
box_max = [
    1.0,
    1.0,
    1.0,
]
periodic_axes = [
    "x",
    "y",
]

[[mesh.parts]]
kind = "plane"
enabled = true
surface_model = "insulator"
surface_side = "normal_plus"
size_x = 1.0
size_y = 1.0
nx = 4
ny = 4
center = [
    0.5,
    0.5,
    0.2,
]

[particles.tracking]
dt_s = 1e-07
max_steps_per_particle = 10

[particles.boundary]
z_low = "open"
z_high = "open"

[[particles.species]]
charge_c = -1.602176634e-19
mass_kg = 9.10938356e-31

[particles.species.source]
mode = "volume_seed"
pos_low = [
    0.5,
    0.5,
    0.8,
]
pos_high = [
    0.5,
    0.5,
    0.8,
]

[particles.species.sampling]
weight = 1.0
volume_macro_particles_per_batch = 1

[particles.species.distribution]
drift_velocity_m_s = [
    0.0,
    0.0,
    -1000000.0,
]
temperature_k = 0.0

[fields]
boundary = "periodic2"

[fields.solver]
method = "fmm"

[fields.periodic]
image_layers = 1
backend = "finite_images"

[output]
enabled = true
dir = "outputs/smoke_single_electron"

[output.history]
stride_batches = 1
