#:schema https://raw.githubusercontent.com/Nkzono99/BEACH/main/schemas/beach.schema.json
# Official tutorial: a 5 eV electron beam charges an isolated 20 mm metal plate in vacuum.
# Beam current = volume_macro_particles_per_batch * weight * e / duration_s = 12.8 uA
# over a 24 mm square, i.e. about 2.2 uA/cm^2. See docs/start/Tutorial.md.

[run]
batch_count = 150
rng_seed = 12345

[run.batch]
duration_s = 1.0e-8

[domain]
box_min = [0.0, 0.0, 0.0]
box_max = [0.04, 0.04, 0.07]
periodic_axes = []

[[mesh.parts]]
kind = "plane"
enabled = true
surface_model = "conductor"
surface_side = "normal_plus"
size_x = 0.02
size_y = 0.02
nx = 10
ny = 10
center = [0.02, 0.02, 0.01]

[particles.tracking]
dt_s = 2.0e-10
max_steps_per_particle = 1500

[particles.boundary]
z_low = "open"
z_high = "open"

[[particles.species]]
charge_c = -1.602176634e-19
mass_kg = 9.1093837139e-31

[particles.species.source]
mode = "volume_seed"
pos_low = [0.008, 0.008, 0.06]
pos_high = [0.032, 0.032, 0.06]

[particles.species.sampling]
weight = 4000.0
volume_macro_particles_per_batch = 200

[particles.species.distribution]
drift_velocity_m_s = [0.0, 0.0, -1.3262e6]
temperature_ev = 0.01

[fields]
boundary = "free"

[fields.solver]
method = "direct"

[output]
enabled = true
dir = "outputs/tutorial"

[output.history]
stride_batches = 1
potential = true

[output.final]
mesh_potential = true
