#:schema https://raw.githubusercontent.com/Nkzono99/BEACH/main/schemas/beach.schema.json

[sim]
# max_step = 500 は固定のまま、通過時間が十分になるよう dt を増やす
dt = 1.4e-8
batch_duration_step = 200.0
batch_count = 5
max_step = 500
tol_rel = 1.0e-8
b0 = [0.0, 0.0, 0.0]
# 一様外部電場はベクトル直接指定か、abs + 角度指定のどちらか片方を使う
# e0 = [0.0, 0.0, -5.0]
# e0_abs = 5.0
# e0_phi_xy_deg = 0.0
# e0_phi_z_deg = -90.0
rng_seed = 12345
# periodic2 + fmm 有効時、field_periodic_far_correction の選択肢:
#   "none"            — 有限 image shell のみ（既定、無限周期解ではない）
#   "auto"            — 互換用 alias。現在は "none" と同じ
#   "cached_kneq0"    — versioned 非零モード operator（production 無限周期用）
# field_solver = "fmm"
# field_bc_mode = "periodic2"
# field_periodic_image_layers = 1
# field_periodic_far_correction = "none"
# field_periodic_ewald_alpha = 0.0
# field_periodic_ewald_layers = 4
# field_periodic_cache_dir = ".beach_cache/periodic2"
# field_periodic_generation_tolerance = 1.0e-8

[domain]
box_min = [0.0, 0.0, 0.0]
box_max = [1.0, 1.0, 4.0]
periodic_axes = ["x"]

[field_boundary]
mode = "free"

[particle_boundary]
y_low = "reflect"
y_high = "reflect"
z_low = "open"
z_high = "open"
ordinary_open_model = "escape"
# ordinary_open_model = "potential_barrier"  # open 面で局所電位障壁による return/escape 判定を行う

[reservoir]
inflow_model = "infinity_barrier"
phi_infty = 0.0
face_potential_grid_n = 3

[particles]
[[particles.species]]
source_mode = "reservoir_face"
number_density_cm3 = 5.0
temperature_ev = 10.0
q_particle = -1.602176634e-19
m_particle = 9.10938356e-31
target_macro_particles_per_batch = 300
# w_particle = 1.0e6  # 直接指定したい場合はこちらを有効化し、target は削除する
inject_face = "z_high"
pos_low = [0.0, 0.0, 4.0]
pos_high = [1.0, 1.0, 4.0]
drift_velocity = [0.0, 0.0, -4.0e5]

# 任意速度グリッドを使う例:
# [[particles.species]]
# source_mode = "reservoir_face"
# velocity_distribution = "grid"
# velocity_grid_path = "examples/velocity_grid.csv"
# velocity_grid_pdf_kind = "phase_space"  # or "flux_weighted"
# velocity_grid_sampling = "rectilinear"  # or "auto", "discrete"
# particle_flux_m2_s = 1.0e12
# # current_density_a_m2 = -1.602176634e-7  # particle_flux_m2_s と排他
# q_particle = -1.602176634e-19
# m_particle = 9.10938356e-31
# target_macro_particles_per_batch = 300
# inject_face = "z_high"
# pos_low = [0.0, 0.0, 4.0]
# pos_high = [1.0, 1.0, 4.0]

# [[particles.species]]
# source_mode = "photo_raycast"
# emit_current_density_a_m2 = 2.0e-4
# rays_per_batch = 500
# deposit_opposite_charge_on_emit = true
# q_particle = -1.602176634e-19
# m_particle = 9.10938356e-31
# temperature_ev = 1.5
# normal_drift_speed = 1.0e5
# inject_face = "z_high"
# surface_charge_closure = "neutral_return"  # 未帰還分を解決済み帰還先へ繰り込み、PEの正味表面電荷を0にする
# pos_low = [0.0, 0.0, 4.0]
# pos_high = [1.0, 1.0, 4.0]
# ray_direction = [0.2, 0.0, -1.0]
# [particles.species.boundary]
# z_high = "reflect"  # 光電子だけをz-highで鏡面反射

[[particles.species]]
source_mode = "reservoir_face"
number_density_cm3 = 5.0
temperature_ev = 10.0
q_particle = 1.602176634e-19
m_particle = 9.10938356e-28
target_macro_particles_per_batch = -1
# w_particle = 1.0e6  # 直接指定したい場合はこちらを有効化し、target は削除する
inject_face = "z_high"
pos_low = [0.0, 0.0, 4.0]
pos_high = [1.0, 1.0, 4.0]
drift_velocity = [0.0, 0.0, -4.0e5]

[mesh]
mode = "template"

# 1) 床（箱の中心に置く。境界 z=0 直上に上げて数値的な不安定/すり抜けを避ける）
[[mesh.templates]]
kind = "plane"
enabled = true
surface_model = "insulator"
surface_side = "normal_plus"
size_x = 1.0
size_y = 1.0
nx = 20
ny = 20
center = [0.50, 0.50, 0.02]

# 2) 小平板（局所構造：箱内に余裕を持って配置）
[[mesh.templates]]
kind = "plane"
enabled = true
surface_model = "conductor"
surface_side = "normal_plus"
size_x = 0.35
size_y = 0.22
nx = 6
ny = 4
center = [0.32, 0.30, 0.30]

# 3) 円柱（床に接地：center_z = z_floor + height/2）
# dielectric は現行では epsilon_r を出力メタデータとして保持するのみ
[[mesh.templates]]
kind = "cylinder"
enabled = true
surface_model = "dielectric"
surface_side = "outward_closed"
epsilon_r = 3.9
radius = 0.14
height = 0.28
center = [0.72, 0.58, 0.16]   # 0.02 + 0.14 = 0.16
cap = true
n_theta = 14
n_z = 4

# 4) 球（床に接地：center_z = z_floor + radius）
[[mesh.templates]]
kind = "sphere"
enabled = true
surface_model = "insulator"
surface_side = "outward_closed"
radius = 0.14
center = [0.34, 0.74, 0.16]   # 0.02 + 0.14 = 0.16
n_lon = 14
n_lat = 6

[output]
write_files = true
write_mesh_potential = false
write_potential_history = false
dir = "outputs/latest"
history_stride = 1
