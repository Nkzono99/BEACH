#:schema https://raw.githubusercontent.com/Nkzono99/BEACH/main/schemas/beach.schema.json
# Generated by beachx config init
# source_config=tests/fixtures/config_layout/beach_legacy.toml

[run]
batch_count = 5
rng_seed = 12345

[run.batch]
duration_steps = 200.0

[domain]
box_min = [
    0.0,
    0.0,
    0.0,
]
box_max = [
    1.0,
    1.0,
    4.0,
]
periodic_axes = [
    "x",
]

[mesh]
mode = "template"

[[mesh.templates]]
kind = "plane"
enabled = true
surface_model = "insulator"
surface_side = "normal_plus"
size_x = 1.0
size_y = 1.0
nx = 20
ny = 20
center = [
    0.5,
    0.5,
    0.02,
]

[[mesh.templates]]
kind = "plane"
enabled = true
surface_model = "conductor"
surface_side = "normal_plus"
size_x = 0.35
size_y = 0.22
nx = 6
ny = 4
center = [
    0.32,
    0.3,
    0.3,
]

[[mesh.templates]]
kind = "cylinder"
enabled = true
surface_model = "insulator"
surface_side = "outward_closed"
radius = 0.14
height = 0.28
center = [
    0.72,
    0.58,
    0.16,
]
cap = true
n_theta = 14
n_z = 4

[[mesh.templates]]
kind = "sphere"
enabled = true
surface_model = "insulator"
surface_side = "outward_closed"
radius = 0.14
center = [
    0.34,
    0.74,
    0.16,
]
n_lon = 14
n_lat = 6

[particles.tracking]
dt_s = 1.4e-08
max_steps_per_particle = 500

[particles.boundary]
y_low = "reflect"
y_high = "reflect"
z_low = "open"
z_high = "open"
open_model = "escape"

[particles.reservoir]
inflow_model = "infinity_barrier"
phi_infty_v = 0.0
face_potential_grid_n = 3

[[particles.species]]
charge_c = -1.602176634e-19
mass_kg = 9.10938356e-31

[particles.species.distribution]
number_density_cm3 = 5.0
temperature_ev = 10.0
drift_velocity_m_s = [
    0.0,
    0.0,
    -400000.0,
]

[particles.species.sampling]
target_macro_particles_per_batch = 300

[particles.species.inflow]
z_high = "reservoir"

[[particles.species]]
charge_c = 1.602176634e-19
mass_kg = 9.10938356e-28

[particles.species.distribution]
number_density_cm3 = 5.0
temperature_ev = 10.0
drift_velocity_m_s = [
    0.0,
    0.0,
    -400000.0,
]

[particles.species.sampling]
target_macro_particles_per_batch = -1

[particles.species.inflow]
z_high = "reservoir"

[fields]
boundary = "free"

[fields.external]
magnetic_t = [
    0.0,
    0.0,
    0.0,
]

[output]
enabled = true
dir = "outputs/latest"

[output.diagnostics]
charge_rel_change_threshold = 1e-08

[output.final]
mesh_potential = false

[output.history]
potential = false
stride_batches = 1
