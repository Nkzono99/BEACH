name = "beach_fortran"
version = "1.4.0"
license = "Apache-2.0"
author = "beach contributors"
maintainer = "beach contributors"
copyright = "2026"

[build]
auto-executables = true
auto-tests = false
auto-examples = false

[library]
source-dir = "src"

[dependencies]
toml-f = { git = "https://github.com/toml-f/toml-f.git", tag = "v0.5.1" }

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[[executable]]
name = "beach"
source-dir = "app"
main = "main.f90"

